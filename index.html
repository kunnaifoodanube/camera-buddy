<style>/* Camera Buddy — UI v0.4 · Design System (Design Implementation Handoff 2026-11-19)
   Minimal Photography: charcoal surfaces, cream cards, amber actions.
   Accents used sparingly: green = positive, pink = praise, lavender = knowledge/technique. */
:root{
  --cb-charcoal:#222222; --cb-charcoal-2:#2D2C2A; --cb-charcoal-3:#3A3936;
  --cb-cream:#F8F5EF; --cb-cream-2:#ECE6DB; --cb-cream-3:#E0D8C9;
  --cb-amber:#FFC845; --cb-amber-tint:#FFF3D1; --cb-amber-ink:#8A6200;
  --cb-green:#88C34A; --cb-green-ink:#4A7A1C;
  --cb-pink:#FF6B9E; --cb-pink-ink:#C2275F;
  --cb-lav:#B39DDB; --cb-lav-tint:#EFE9F9; --cb-lav-ink:#5A4699;
  --cb-ink:#222222; --cb-ink-2:#6B645A; --cb-on-dark:#F8F5EF; --cb-on-dark-2:#B8B1A5;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px;
  --r-sm:12px; --r-md:16px; --r-lg:20px; --r-pill:999px;
  --shadow:0 4px 12px rgba(0,0,0,.16);
  --font-display:"Kanit",system-ui,sans-serif;
  --font-body:"Noto Sans Thai","Kanit",system-ui,sans-serif;
  --tabbar-h:68px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#161616;font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
/* context colours: dark surfaces by default, cream cards switch them */
.app{position:relative;max-width:480px;min-height:100dvh;margin:0 auto;background:var(--cb-charcoal);color:var(--cb-on-dark);overflow-x:hidden;
  --muted:var(--cb-on-dark-2); --line:var(--cb-charcoal-3); --chip-bg:var(--cb-charcoal-3); --chip-fg:var(--cb-on-dark); --chip-on-bg:var(--cb-amber); --chip-on-fg:var(--cb-charcoal)}
.panel,.set,.wk,.tipcard,.sheet-panel,.bubble,.msgs,.card,.cmp-card,.composer,.suggest{color:var(--cb-ink);
  --muted:var(--cb-ink-2); --line:var(--cb-cream-2); --chip-bg:var(--cb-cream-2); --chip-fg:var(--cb-charcoal); --chip-on-bg:var(--cb-charcoal); --chip-on-fg:var(--cb-cream)}
.view{display:none;min-height:100dvh}
.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.ic{display:block;flex:none}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:15px;line-height:1.55}
.cap{font-size:13.5px;line-height:1.45}

/* buttons — min 48px touch targets */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:var(--r-pill);min-height:48px;padding:0 22px;font-family:var(--font-display);font-weight:500;font-size:17px;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn-lg{min-height:56px;font-size:19px}
.btn-block{width:100%}
.btn-sm{min-height:48px;font-size:15.5px;padding:0 16px}
.btn-amber{background:var(--cb-amber);color:var(--cb-charcoal)}
.btn-cream{background:var(--cb-cream);color:var(--cb-charcoal)}
.btn-dark{background:var(--cb-charcoal);color:var(--cb-cream)}
.btn-outline{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn-ghost{background:var(--cb-charcoal-2);color:var(--cb-on-dark)}
.btn:disabled{opacity:.45}
.iconbtn{width:48px;height:48px;border:0;border-radius:var(--r-pill);background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer}
.link{background:none;border:0;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:62px;padding:6px 6px;background:var(--cb-charcoal);color:var(--cb-on-dark)}
.topbar h1{font-size:21px;font-weight:500;text-align:center}
.topbar .who{display:flex;align-items:center;gap:10px;justify-self:start}
.topbar .who b{display:block;font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.2}
.topbar .who span{font-size:13px;color:var(--cb-on-dark-2)}
.page{padding:var(--sp-3) var(--sp-4) calc(var(--tabbar-h) + var(--sp-8))}
.page.no-tab{padding-bottom:var(--sp-10)}
.page-title{font-family:var(--font-display);font-weight:600;font-size:26px;text-align:center;padding:18px 16px 6px}

/* home */
.home{position:relative;height:100dvh;min-height:660px;background:var(--cb-charcoal);color:var(--cb-on-dark);overflow:hidden}
.home-photo{position:absolute;inset:0;background-size:cover;background-position:66% 62%}
.home-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(34,34,34,.78) 0%,rgba(34,34,34,.30) 22%,rgba(34,34,34,0) 36%,rgba(34,34,34,0) 58%,rgba(34,34,34,.55) 76%,rgba(34,34,34,.92) 92%)}
.hero-pending{position:absolute;left:24px;right:24px;top:30%;bottom:calc(var(--tabbar-h) + 220px);min-height:150px;border:2px dashed rgba(255,200,69,.55);border-radius:var(--r-lg);display:grid;place-items:center;text-align:center;padding:12px;background:radial-gradient(ellipse at 50% 60%,rgba(255,200,69,.10),rgba(255,200,69,0) 70%)}
.hero-pending .p-tag{font-size:11px;letter-spacing:.6px;font-weight:700;color:var(--cb-charcoal);background:var(--cb-amber);border-radius:4px;padding:0 6px}
.hero-pending p{font-size:13.5px;color:var(--cb-on-dark-2);margin-top:6px}
.draft-tag{position:absolute;z-index:3;left:14px;top:14px;font-size:12px;font-weight:600;background:rgba(34,34,34,.7);color:var(--cb-amber);border:1px solid rgba(255,200,69,.6);border-radius:var(--r-pill);padding:2px 10px}
.home-top{position:relative;z-index:2;display:flex;justify-content:flex-end;padding:10px 10px 0}
.home-title{position:relative;z-index:2;padding:4px 28px 0;text-align:center}
.brand{font-family:var(--font-display);font-weight:600;font-size:50px;line-height:1.0;letter-spacing:-.3px}
.brand .b2{display:inline-flex;align-items:flex-start;gap:4px;color:var(--cb-amber)}
.tagline{margin-top:10px;font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--cb-on-dark)}
.home-actions{position:absolute;z-index:2;left:0;right:0;bottom:calc(var(--tabbar-h) + 16px);padding:0 24px;display:grid;gap:12px}
.home-actions .btn{min-height:60px;font-size:20px;box-shadow:var(--shadow)}
.home-note{text-align:center;font-size:14px;color:var(--cb-on-dark)}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--tabbar-h);z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:#1B1B1B;border-top:1px solid #2F2F2F;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--font-display);font-size:13.5px;color:var(--cb-on-dark-2);text-decoration:none}
.tabbar a.on{color:var(--cb-amber);font-weight:500}
.tabbar.hide{display:none}

/* photo frame + reaction badge + overlay tools */
.frame-wrap{position:relative;padding:var(--sp-3) var(--sp-4) 0}
.frame{position:relative;border-radius:var(--r-lg);overflow:hidden;border:6px solid var(--cb-cream);background:#111;box-shadow:var(--shadow)}
.frame img{display:block;width:100%;height:auto;max-height:60dvh;object-fit:contain;background:#111}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.badge-react{position:absolute;top:0;right:12px;transform:rotate(-5deg);background:var(--cb-amber);color:var(--cb-charcoal);font-family:var(--font-display);font-weight:600;font-size:20px;padding:5px 16px;border-radius:var(--r-pill);box-shadow:0 3px 10px rgba(0,0,0,.28);border:2.5px solid var(--cb-cream);z-index:3}
.badge-react.praise{background:var(--cb-pink)}
.badge-react.low{top:auto;bottom:58px}
.react-stk{position:absolute;top:-14px;right:0;z-index:3;transform:rotate(5deg);filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));pointer-events:none}
.react-stk.low{top:auto;bottom:44px}
.ovbar{padding:10px var(--sp-4) 0}
.ovseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ovseg .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;min-height:58px;font-size:14px;line-height:1.2;border-radius:14px}
.ovbar .cap{margin-top:6px;color:var(--cb-on-dark-2)}

/* buddy speech */
.say{display:flex;align-items:flex-start;gap:10px;padding:var(--sp-4) var(--sp-4) 0}
.say>.avatar{width:58px;height:58px}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--cb-cream);background:var(--cb-charcoal-3)}
.avatar.lg{width:84px;height:84px;border-width:3px}
.bubble{background:var(--cb-cream);border-radius:20px 20px 20px 6px;padding:10px 16px;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bubble b{font-family:var(--font-display);font-weight:500;font-size:19px;line-height:1.35;display:inline-flex;align-items:center;gap:6px}
.bubble p{font-size:16px}
.say .stk{margin-top:8px}
.say-stack{display:flex;flex-direction:column;align-items:flex-start;min-width:0}

/* sticker slots (ASSET_PENDING until approved PNGs exist) */
.sticker{display:block}
.sticker.pending{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px dashed var(--cb-amber);border-radius:var(--r-md);background:rgba(255,200,69,.10);color:inherit;text-align:center;padding:4px}
.sticker.pending .p-tag{font-size:10px;letter-spacing:.5px;font-weight:700;color:var(--cb-amber-ink);background:var(--cb-amber-tint);border-radius:4px;padding:0 4px}
.sticker.pending .p-text{font-family:var(--font-display);font-weight:500;font-size:14px;line-height:1.25}
.sticker.pending .p-file{font-size:9.5px;opacity:.7;word-break:break-all;line-height:1.2}

/* cream cards */
.panel{background:var(--cb-cream);border-radius:var(--r-lg);margin:var(--sp-4) var(--sp-3) 0;padding:var(--sp-5) var(--sp-4);box-shadow:var(--shadow)}
.panel:last-child{margin-bottom:var(--sp-8)}
.panel.card{margin:var(--sp-4) 0 0}
.card{background:var(--cb-cream);border-radius:var(--r-md);padding:var(--sp-4);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:18px;margin-bottom:10px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.checks li .ic-check{margin-top:2px;flex:none}
.tip{background:var(--cb-amber-tint);border-radius:var(--r-md);padding:14px 16px;margin-top:var(--sp-4)}
.tip h3{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:500;margin-bottom:6px}
.tip ul{margin:0;padding-left:20px}
.tip li{margin:4px 0;font-size:16px}
.tip.lav{background:var(--cb-lav-tint)}
.tip.lav h3{color:var(--cb-lav-ink)}
.row{display:flex;gap:10px}
.row>.btn{flex:1}
.actions{margin-top:var(--sp-5)}
.sec-title{font-family:var(--font-display);font-weight:600;font-size:18px;margin:var(--sp-6) 0 var(--sp-3)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--cb-amber-tint);color:var(--cb-ink);border-radius:var(--r-md);padding:12px 14px;font-size:15px;margin-bottom:var(--sp-3)}
.note .ic{color:var(--cb-amber-ink);margin-top:2px}
.divider{height:1px;background:var(--line);margin:var(--sp-5) 0}

/* details */
details.more{margin-top:var(--sp-3)}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:48px;font-family:var(--font-display);font-weight:500;font-size:17px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary .ic{transition:transform .2s}
details.more[open]>summary .ic{transform:rotate(90deg)}
.scores{display:grid;gap:12px;margin-top:4px}
.score{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:15.5px}
.stars{display:inline-flex;gap:2px;color:var(--cb-ink-2);vertical-align:middle}
.stars svg{display:block}
.star-h small,.star-tag{font-family:var(--font-body);font-weight:500;font-size:14px;color:var(--cb-pink-ink)}
.star-note{margin-top:12px;font-size:14.5px;line-height:1.55;background:var(--cb-cream-2);border-radius:var(--r-sm);padding:10px 12px;color:var(--cb-ink)}
.score b{font-family:var(--font-display);font-weight:600;text-align:right}
.bar{height:10px;border-radius:99px;background:var(--cb-cream-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--cb-amber)}
.bar i.hi{background:var(--cb-green)}
.score .na{grid-column:2/3;font-size:14px;color:var(--muted)}
.score-note{grid-column:1/-1;font-size:14px;color:var(--muted);margin-top:-6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:var(--r-pill);background:var(--chip-bg);color:var(--chip-fg);padding:0 16px;font-family:var(--font-display);font-size:15.5px;cursor:pointer;min-height:48px}
.chip.on{background:var(--chip-on-bg);color:var(--chip-on-fg);font-weight:500}
.find{padding:10px 0;border-bottom:1px solid var(--line)}
.find:last-child{border:0}
.find .t{font-weight:600}
.find .small{margin-top:2px}
.conf{font-size:13px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--cb-cream-2);white-space:nowrap}
.hist{width:100%;height:56px;display:block}

/* adjust */
.first{background:var(--cb-amber);color:var(--cb-charcoal);border-radius:var(--r-lg);padding:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;box-shadow:var(--shadow)}
.first .lab{font-family:var(--font-display);font-size:14px;font-weight:500;color:var(--cb-charcoal);opacity:.75}
.first h2{font-size:20px;font-weight:600;margin-top:2px}
.first p{font-size:15px;margin-top:6px}
.setup{display:grid;gap:2px}
.setup .it{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.setup .it:last-child{border:0}
.setup .ib{width:44px;height:44px;border-radius:12px;background:var(--cb-amber-tint);display:grid;place-items:center;color:var(--cb-charcoal)}
.setup .k{font-size:14px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.steps li:last-child{border:0}
.steps input{width:24px;height:24px;margin-top:2px;accent-color:var(--cb-green);flex:none}
.bul{margin:0;padding-left:20px} .bul li{margin:6px 0}

/* compare */
.cmp{position:relative;border-radius:var(--r-lg);overflow:hidden;border:6px solid var(--cb-cream);background:#111;touch-action:pan-y;box-shadow:var(--shadow)}
.cmp img{display:block;width:100%;height:auto}
.cmp .after{position:absolute;inset:0;overflow:hidden}
.cmp .after img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lbl{position:absolute;top:10px;font-family:var(--font-display);font-weight:600;font-size:16px;border-radius:var(--r-pill);padding:2px 14px;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.lbl.b{background:var(--cb-amber);color:var(--cb-charcoal)} .lbl.a{background:var(--cb-cream);color:var(--cb-charcoal)}
.cmp .handle{position:absolute;top:0;bottom:0;width:3px;background:var(--cb-amber);pointer-events:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .pi{position:relative}
.pair img{width:100%;border-radius:var(--r-md);display:block;border:5px solid var(--cb-cream)}
.pair .lbl{left:10px}
input[type=range]{width:100%;height:32px;accent-color:var(--cb-amber)}
table.delta{width:100%;border-collapse:collapse;font-size:15.5px}
table.delta td,table.delta th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
table.delta th{color:var(--muted);font-size:14px}
table.delta .n{text-align:center;white-space:nowrap}
.up{color:var(--cb-green-ink);font-weight:600} .down{color:var(--cb-pink-ink);font-weight:600}
.ic-down{color:var(--cb-pink)}

/* chat */
.chat{flex-direction:column;height:100dvh;background:var(--cb-cream)}
.view.chat.on{display:flex}
.chat .topbar{position:relative}
.msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px;background:var(--cb-cream);border-radius:22px 22px 0 0}
.m{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .bubble{background:#fff;border-radius:20px 20px 20px 6px;white-space:pre-wrap;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.m.me .bubble{background:var(--cb-amber-tint);border-radius:20px 20px 6px 20px}
.m.me .photo-msg{border-radius:18px;border:5px solid #fff;max-width:240px;display:block;box-shadow:var(--shadow)}
.m .time{font-size:12px;color:var(--muted);margin:0 4px 2px}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 8px;scrollbar-width:none;background:var(--cb-cream)}
.suggest .chip{flex:none;background:var(--cb-amber-tint);color:var(--cb-charcoal);box-shadow:inset 0 0 0 1.5px var(--cb-amber)}
.composer{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--cb-cream);border-top:1px solid var(--cb-cream-2)}
.composer input{min-width:0;width:100%;min-height:48px;border:0;border-radius:var(--r-pill);background:#fff;padding:0 16px;box-shadow:inset 0 0 0 1px var(--cb-cream-3);outline:none}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--cb-amber);color:var(--cb-charcoal);display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.45}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--cb-ink-2);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* works / batch grids */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wk{position:relative;border:0;padding:0;background:var(--cb-cream);border-radius:var(--r-md);overflow:hidden;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.wk img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.wk .meta{padding:8px 10px 10px}
.wk .meta b{font-family:var(--font-display);font-weight:500;font-size:15.5px;display:block;line-height:1.3}
.wk .meta span{font-size:13.5px;color:var(--muted)}
.wk .pill{position:absolute;top:8px;left:8px;background:var(--cb-amber);color:var(--cb-charcoal);font-family:var(--font-display);font-weight:500;font-size:13.5px;border-radius:var(--r-pill);padding:1px 10px}
.wk .pill.praise{background:var(--cb-pink)}
.th{position:relative;border:0;padding:5px;background:var(--cb-cream);border-radius:var(--r-md);cursor:pointer;box-shadow:var(--shadow);min-height:48px}
.th img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.th .sc{display:flex;align-items:center;justify-content:center;padding:5px 0 1px;color:var(--cb-ink-2)}
.th .n{position:absolute;top:9px;left:9px;background:rgba(34,34,34,.75);color:var(--cb-cream);font-size:12.5px;border-radius:var(--r-pill);padding:0 8px}
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.plist li:last-child{border:0}
.plist b{font-family:var(--font-display);font-weight:500}
.empty{text-align:center;padding:36px 16px;display:grid;justify-items:center;gap:12px}

/* tips */
.tiplist{display:grid;gap:10px}
.tipcard{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px;background:var(--cb-cream);border-radius:var(--r-md);box-shadow:var(--shadow)}
.tipcard .ib{width:52px;height:52px;border-radius:12px;background:var(--cb-lav-tint);color:var(--cb-lav-ink);display:grid;place-items:center}
.tipcard summary{list-style:none;cursor:pointer;min-height:48px}
.tipcard summary::-webkit-details-marker{display:none}
.tipcard summary b{font-family:var(--font-display);font-weight:500;font-size:17.5px;display:block;line-height:1.35}
.tipcard .try{background:var(--cb-lav-tint);border-radius:var(--r-sm);padding:10px 12px;margin-top:8px;font-size:15.5px}
.tipcard .try b{color:var(--cb-lav-ink)}
.tag{display:inline-block;font-size:13px;background:var(--cb-cream-2);border-radius:var(--r-pill);padding:2px 10px;margin-bottom:6px}
.filter{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:4px -16px 4px;padding:0 16px}
.filter .chip{flex:none}

/* profile */
.prof{display:flex;align-items:center;gap:14px;padding:6px 2px 4px}
.prof .av-wrap{position:relative}
.prof h2{font-size:24px;font-weight:600}
.prof .dot{position:absolute;right:2px;bottom:4px;width:20px;height:20px;border-radius:50%;border:3px solid var(--cb-charcoal);background:var(--cb-green)}
.prof .dot.off{background:#8D867B}
.status{display:inline-block;font-size:13.5px;font-weight:600;border-radius:var(--r-pill);padding:1px 12px;background:var(--cb-green);color:#1F3209;margin-top:4px}
.status.off{background:var(--cb-charcoal-3);color:var(--cb-on-dark-2)}
.set{background:var(--cb-cream);border-radius:var(--r-md);padding:4px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.set .li{padding:14px 0;border-bottom:1px solid var(--line)}
.set .li:last-child{border:0}
.set .lh{font-family:var(--font-display);font-weight:500;font-size:17.5px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;min-height:48px;font-family:var(--font-display);font-weight:500;font-size:17.5px}
.switch input{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--cb-cream-3);position:relative;flex:none;cursor:pointer;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch input:checked{background:var(--cb-green)}
.switch input:checked::after{left:25px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-top:8px;font-size:15.5px}
.qrow .bar{grid-column:1/-1;height:10px}
.qrow .bar i{background:var(--cb-green)} .qrow .bar i.mid{background:var(--cb-amber)} .qrow .bar i.full{background:var(--cb-pink)}
.qrow b{font-family:var(--font-display);font-weight:600}
.privacy{display:flex;gap:12px;align-items:flex-start}
.privacy .ib{width:40px;height:40px;border-radius:50%;background:#EAF4DD;color:var(--cb-green-ink);display:grid;place-items:center;flex:none}
.btn-danger{background:transparent;color:var(--cb-pink-ink);box-shadow:inset 0 0 0 1.5px var(--cb-pink)}
.field{width:100%;min-height:48px;border:0;border-radius:var(--r-sm);background:#fff;padding:0 14px;box-shadow:inset 0 0 0 1px var(--cb-cream-3)}

/* analysing screen (full screen) */
.busy{position:fixed;inset:0;z-index:60;background:var(--cb-charcoal);display:none;align-items:center;justify-content:center;padding:24px}
.busy.on{display:flex}
.busy-card{color:var(--cb-on-dark);width:100%;max-width:360px;display:grid;justify-items:center;gap:12px;text-align:center}
.busy-card b{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.25;margin-top:8px}
.busy-sub{font-size:16px;color:var(--cb-on-dark-2);min-height:26px}
.pbar{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:6px}
.pbar .bar{height:12px;background:var(--cb-charcoal-3)}
.pbar .bar i{transition:width .4s ease}
.pbar span{font-family:var(--font-display);font-size:15px;color:var(--cb-amber);min-width:36px;text-align:right}
.busy-note{font-size:13.5px;color:var(--cb-on-dark-2);min-height:20px}
.busy .btn{margin-top:14px;min-width:200px}
.prog{display:none}

/* quota screen */
.quota{min-height:100dvh;display:grid;align-content:center;justify-items:center;gap:12px;text-align:center;padding:32px 24px 40px}
.quota h2{font-size:40px;font-weight:600;line-height:1.1;margin-top:8px}
.quota h2 span{display:block;color:var(--cb-amber);font-size:34px}
.quota .big{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.1}
.quota .infobox{display:flex;gap:12px;align-items:center;text-align:left;background:var(--cb-charcoal-2);border:1px solid var(--cb-charcoal-3);border-radius:var(--r-md);padding:14px 16px;margin-top:6px;width:100%}
.quota .infobox .ic{color:var(--cb-amber)}
.quota .btn{width:100%}

/* sheet, toast, demos */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(20,20,20,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-panel{background:var(--cb-cream);width:100%;max-width:480px;max-height:86dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 28px}
.sheet-panel h2{font-size:21px;font-weight:600;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 16px);transform:translateX(-50%);background:var(--cb-cream);color:var(--cb-charcoal);padding:10px 16px;border-radius:var(--r-pill);font-size:15px;z-index:80;display:none;max-width:88%;text-align:center;box-shadow:var(--shadow)}
.toast.on{display:block}
.demo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.demo button{border:0;padding:0;border-radius:var(--r-md);overflow:hidden;background:#fff;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.demo img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.demo span{display:block;padding:6px 8px;font-size:14px}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}.pbar .bar i{transition:none}}

/* faculty promo card */
.promo{display:grid;gap:4px;margin-top:var(--sp-6);padding:16px 18px;border-radius:var(--r-lg);background:var(--cb-charcoal-2);border:1px solid var(--cb-charcoal-3);color:var(--cb-on-dark);text-decoration:none}
.promo .pl{justify-self:start;font-size:13px;font-weight:600;color:var(--cb-charcoal);background:var(--cb-amber);border-radius:var(--r-pill);padding:1px 10px}
.promo b{font-family:var(--font-display);font-weight:600;font-size:18px;margin-top:4px}
.promo .pt{font-size:15px;color:var(--cb-on-dark-2)}
.promo .pc{display:inline-flex;align-items:center;gap:2px;color:var(--cb-amber);font-family:var(--font-display);font-weight:500;font-size:16px;margin-top:4px;min-height:32px}
/* v0.5.0 — Puter sign-in card on home */
.login-card{background:rgba(34,34,34,.82);color:var(--cb-on-dark);border-radius:16px;padding:14px 16px;display:grid;gap:8px;backdrop-filter:blur(6px)}
.login-card b{font-family:Kanit,sans-serif;font-weight:600;font-size:17px;color:#FFC845}
.login-card p{margin:0;font-size:15px;line-height:1.5}
.login-card .fine{font-size:15px;opacity:.8}
.home-actions .login-card .btn{min-height:52px;font-size:17px}
</style>
</head>

/* Camera Buddy — Buddy Reactions (Design System §6)
 * Reactions are part of the feedback system: chosen from real analysis results, never at random.
 * Sticker images are embedded by the build only from the owner-approved folder. Until a file is approved,
 * the slot renders an explicit ASSET_PENDING placeholder (see ASSET_LIST in Drive).
 */
const CBReactions = (() => {
  const R = {
    great:      { text: "เยี่ยมเลย!",          file: "buddy_great.png",       line: "ภาพนี้ดีมาก!" },
    light_nice: { text: "แสงสวย!",             file: "buddy_light_nice.png",  line: "แสงสวยมาก!" },

    tip_light:  { text: "เพิ่มแสงอีกหน่อย",      file: "buddy_tip_light.png",   line: "ภาพยังมืดไปหน่อยนะ" },
    better:     { text: "เก่งขึ้นแล้ว!",          file: "buddy_better.png",      line: "ภาพใหม่ดีขึ้นแล้ว!" },
    analyze:    { text: "บัดดี้กำลังดูรูป...",    file: "buddy_analyze.png",     line: "" },
    tip_angle:  { text: "ลองมุมนี้ดูสิ!",         file: "buddy_tip_angle.png",   line: "" },
    hello:      { text: "สวัสดี!",               file: "buddy_hello.png",       line: "" },
    rest:       { text: "พักแป๊บ~ แล้วมาถ่ายต่อ!", file: "buddy_rest.png",        line: "" },
    measured:   { text: "",                     file: "",                      line: "เช็กแสง ความคม และสีให้แล้ว" },
  };
  // Approved sticker images (data URIs) are registered here by the build once files are approved in Drive.
  const APPROVED = (typeof window !== "undefined" && window.CB_STICKERS) || {};

  /* pick a reaction from the analysis — honest mapping, AI-only praise needs AI scores */
  function forPhoto(p) {
    if (!p) return null;
    const issues = p.local.findings.filter((f) => f.kind === "issue").map((f) => f.title).join(" | ");
    if (/มืดเกินไป/.test(issues)) return "tip_light";
    const ai = p.ai;
    const sc = {};
    for (const d of ["composition", "lighting", "focus", "color", "story", "technical"]) {
      const a = ai && ai.scores[d] && ai.scores[d].score;
      sc[d] = a || p.local.scores[d] || null;
    }

  const GENRES = {
    auto: "ให้ระบบเดา", portrait: "ภาพคน", pet: "สัตว์เลี้ยง", landscape: "วิว/ทิวทัศน์",
    food: "อาหาร", street: "สตรีท/ชีวิตประจำวัน", night: "กลางคืน/แสงน้อย", other: "อื่น ๆ",
  };

  /* ---------- formatting helpers ---------- */
  function fmtShutter(t) {
    if (t == null) return null;
    if (t >= 1) return `${+t.toFixed(1)} วินาที`;
    return `1/${Math.round(1 / t)} วินาที`;
  }
  function exifFacts(ex) {
    if (!ex) return [];
    const f = [];
    const dev = [ex.make, ex.model].filter(Boolean).join(" ").replace(/^(\w+) \1 /i, "$1 ");
    if (dev) f.push(["อุปกรณ์", dev]);
    if (ex.lens) f.push(["เลนส์", ex.lens]);
    if (ex.iso != null) f.push(["ISO", String(ex.iso)]);
    if (ex.exposureTime != null) f.push(["ความเร็วชัตเตอร์", fmtShutter(ex.exposureTime)]);
    if (ex.fNumber != null) f.push(["รูรับแสง", "f/" + (+ex.fNumber.toFixed(1))]);
    if (ex.focalLength != null) f.push(["ทางยาวโฟกัส", `${+ex.focalLength.toFixed(1)} มม.` + (ex.focal35 ? ` (เทียบเท่า ${ex.focal35} มม.)` : "")]);
    if (ex.exposureBias) f.push(["ชดเชยแสง", (ex.exposureBias > 0 ? "+" : "") + (+ex.exposureBias.toFixed(1)) + " EV"]);
    if (ex.flash != null) f.push(["แฟลช", (ex.flash & 1) ? "ยิงแฟลช" : "ไม่ได้ยิงแฟลช"]);
    if (ex.dateTime) f.push(["วันเวลาที่ถ่าย", ex.dateTime.replace(/^(\d{4}):(\d{2}):(\d{2})/, "$3/$2/$1")]);
    return f;
  }

  /* ---------- local interpretation ---------- */
  function localReport(m, ex, meta) {
    const F = [];
    const e = m.exposure, c = m.color, s = m.sharp;
    const push = (o) => F.push(o);
    const noisy = m.noise.viewSigma > 2.5;
    const scores = {};

    // ---- lighting / exposure
    let L = 5;
    const range = e.p95 - e.p5;
    const backlit = e.borderMean > 165 && e.centerMean < e.borderMean - 70;
    if (backlit) {
      L = Math.min(L, 3);
      push({ dim: "lighting", kind: "issue", title: "ฉากหลังสว่างกว่าตัวแบบมาก (ย้อนแสง)",
        evidence: `ความสว่างกลางภาพเฉลี่ย ${Math.round(e.centerMean)} จาก 255 แต่ขอบภาพ ${Math.round(e.borderMean)} และมีพื้นที่ขาวจนไม่มีรายละเอียด ${e.highlightClipPct}%`,
        cause: "แหล่งแสงหลักอยู่ด้านหลังตัวแบบ กล้องจึงวัดแสงตามฉากหลังที่สว่าง ทำให้ตัวแบบมืด", confidence: "ปานกลาง",
        fix: "แตะหน้าจอที่ตัวแบบเพื่อให้กล้องวัดแสงที่ตัวแบบ หรือเปิด HDR หรือหมุนตัว/ย้ายตำแหน่งให้แสงส่องจากด้านข้าง",
        edit: "ยกเงา (Shadows) ขึ้นเฉพาะตัวแบบ และลดส่วนสว่าง (Highlights)", principles: ["backlight_hdr", "light_direction"] });
    }
    if (e.mean < 75 && e.p99 < 150) {
      L = Math.min(L, e.mean < 50 ? 2 : 3);
      push({ dim: "lighting", kind: "issue", title: "ภาพมืดเกินไป (แสงไม่พอ)",
        evidence: `ความสว่างเฉลี่ย ${Math.round(e.mean)} จาก 255 และแม้ส่วนที่สว่างที่สุดก็สว่างเพียงระดับ ${e.p99}`,
        cause: "แสงในสถานที่น้อย หรือกล้องเลือกค่าที่ทำให้ภาพมืด", confidence: "สูง",
        fix: "เพิ่มแสง (เปิดไฟ ย้ายเข้าใกล้หน้าต่าง) หรือเลื่อนแถบความสว่างบนหน้าจอขึ้นก่อนกดถ่าย",
        edit: "เพิ่ม Exposure ทีละน้อย ระวังนอยส์ที่จะเห็นชัดขึ้น", principles: ["exposure_comp", "iso_noise"] });
    } else if (e.mean < 75 && e.p99 >= 180) {
      L = Math.min(L, 4);
      push({ dim: "lighting", kind: "note", title: "ภาพโทนมืด (Low-key) — อาจเป็นความตั้งใจ",
        evidence: `ความสว่างเฉลี่ยต่ำ (${Math.round(e.mean)}) แต่ยังมีส่วนสว่างชัด (ระดับ ${e.p99})`,
        cause: "ฉากกลางคืนหรือแสงเฉพาะจุดมักให้ภาพลักษณะนี้", confidence: "ปานกลาง",
        fix: "ถ้าตั้งใจให้ดูมืดลึกลับ ถือว่าเหมาะ ถ้าอยากเห็นรายละเอียดในเงามากขึ้น ให้เพิ่มแสงหรือชดเชยแสง +0.3 ถึง +0.7",
        edit: "ยกเงาเล็กน้อยโดยไม่ยกส่วนสว่าง", principles: ["intent_vs_error", "exposure_comp"] });
    }
    if (!backlit) {
      if (e.highlightClipPct > 12 || (e.mean > 175 && e.highlightClipPct > 5)) {
        L = Math.min(L, 2);
        push({ dim: "lighting", kind: "issue", title: "ภาพสว่างเกินจนรายละเอียดหาย",
          evidence: `พื้นที่ขาวสนิท ${e.highlightClipPct}% ของภาพ ความสว่างเฉลี่ย ${Math.round(e.mean)}`,
          cause: "รับแสงมากเกินไป หรือมีแสงแรงส่องตรง", confidence: "สูง",
          fix: "แตะส่วนที่สว่างที่สุดบนจอแล้วเลื่อนความสว่างลง หรือหลบแดดจัด", edit: "ลด Highlights — แต่ส่วนที่ขาวสนิทแล้วกู้คืนไม่ได้", principles: ["exposure_comp"] });
      } else if (e.highlightClipPct > 5) {
        L = Math.min(L, 3);
        push({ dim: "lighting", kind: "issue", title: "มีบางส่วนสว่างจนเป็นสีขาวล้วน",
          evidence: `พื้นที่ขาวสนิท ${e.highlightClipPct}% ของภาพ (ดูได้จากปุ่ม "จุดสว่าง/มืดเกิน")`,
          cause: "ส่วนนั้นสว่างกว่าที่กล้องเก็บรายละเอียดได้", confidence: "สูง",
          fix: "ถ้าส่วนที่ขาวคือจุดสำคัญ ให้ลดความสว่างลงเล็กน้อยก่อนถ่าย", edit: "ลด Highlights / Whites", principles: ["exposure_comp", "backlight_hdr"] });
      } else if (e.highlightClipPct > 1.5) {
        push({ dim: "lighting", kind: "note", title: "มีจุดขาวสนิทเล็กน้อย",
          evidence: `${e.highlightClipPct}% ของภาพ`, cause: "มักเป็นท้องฟ้า หลอดไฟ หรือแสงสะท้อน — ยอมรับได้ถ้าไม่ใช่ส่วนสำคัญ", confidence: "ปานกลาง", fix: "", edit: "", principles: [] });
      }
    }
    if (range < 50 && e.mean >= 75) { // dark images are compressed by nature; handled by the 'too dark' finding
      L = Math.min(L, 3);
      push({ dim: "lighting", kind: "issue", title: "ภาพดูจืด แบน (คอนทราสต์ต่ำ)",
        evidence: `ช่วงความสว่างส่วนใหญ่อยู่แคบ ๆ ระหว่างระดับ ${e.p5}–${e.p95} จาก 255`,
        cause: "แสงนุ่มมาก หมอก/ฝ้าบนเลนส์ หรือถ่ายผ่านกระจก", confidence: "ปานกลาง",
        fix: "เช็ดเลนส์ก่อนถ่าย หาแสงที่มีทิศทางมากขึ้น หรือหลีกเลี่ยงถ่ายผ่านกระจก", edit: "เพิ่ม Contrast และ Dehaze เล็กน้อย", principles: ["light_direction"] });
    }
    if (e.shadowClipPct > 10 && e.highlightClipPct > 3) {
      L = Math.min(L, 3);
      push({ dim: "lighting", kind: "issue", title: "ช่วงแสงกว้างเกินกล้อง (มืดตื้อและขาวโพลนพร้อมกัน)",
        evidence: `ดำสนิท ${e.shadowClipPct}% และขาวสนิท ${e.highlightClipPct}%`,
        cause: "ฉากมีทั้งส่วนสว่างจัดและมืดจัด (Dynamic Range กว้าง)", confidence: "สูง",
        fix: "เปิดโหมด HDR หรือเปลี่ยนมุมให้ส่วนสว่างจัดออกจากเฟรม", edit: "ยกเงา ลดส่วนสว่าง", principles: ["backlight_hdr"] });
    }
    if (!F.some((x) => x.dim === "lighting" && x.kind === "issue")) {
      push({ dim: "lighting", kind: "good", title: "การรับแสงโดยรวมอยู่ในช่วงที่ดี",
        evidence: `ไม่มีพื้นที่ขาวหรือดำสนิทเกินควร (ขาว ${e.highlightClipPct}%, ดำ ${e.shadowClipPct}%) ความสว่างเฉลี่ย ${Math.round(e.mean)}`, principles: [] });
    }
    scores.lighting = L;

    // ---- focus / sharpness
    let Fs = s.index < 0.12 ? 1 : s.index < 0.25 ? 2 : s.index < 0.45 ? 3 : s.index < 0.8 ? 4 : 5;
    const directional = s.anisotropy > 3 && s.index < 0.8;
    const slow = ex && ex.exposureTime != null ? ex.exposureTime : null;
    const safe = ex && ex.focal35 ? 1 / ex.focal35 : 1 / 30;
    const slowShutter = slow != null && slow > safe * 1.5;
    if (Fs <= 3) {
      const causes = [];
      let cause, conf;
      if (directional) {
        cause = `รอยเบลอมีทิศทาง (${s.smearDirection}) ซึ่งเข้ากับการเคลื่อนไหว — อาจเป็นมือ/กล้องสั่น หรือตัวแบบขยับ`;
        conf = "ปานกลาง";
        causes.push("กล้องสั่นขณะกด", "ตัวแบบเคลื่อนไหว", "อาจตั้งใจทำ Motion Blur");
      } else {
        cause = "รอยเบลอกระจายทุกทิศทาง ซึ่งมักเกิดจากโฟกัสไม่ตรง (โฟกัสหลุดไปที่อื่น) หรือเลนส์สกปรก";
        conf = "ต่ำ";
        causes.push("โฟกัสผิดจุด", "เลนส์มีคราบ", "ถ่ายใกล้เกินระยะที่โฟกัสได้");
      }
      if (slowShutter) { cause += ` — และข้อมูลกล้องระบุชัตเตอร์ ${fmtShutter(slow)} ซึ่งช้าพอที่จะทำให้ภาพสั่นได้ถ้าถือด้วยมือ`; conf = "ปานกลาง"; }
      push({ dim: "focus", kind: "issue", title: Fs <= 2 ? "ภาพไม่คมชัด" : "ภาพนุ่ม/คมไม่เต็มที่",
        evidence: `ค่าความคมของส่วนที่คมที่สุดในภาพ = ${s.index} (ภาพคมปกติมักสูงกว่า 0.8)` + (directional ? ` และรายละเอียดในแนว${s.smearDirection.replace("แนว", "")}หายไปมากกว่าแนวอื่น ${s.anisotropy} เท่า` : ""),
        cause, confidence: conf, possible: causes,
        fix: directional ? "ถือกล้องสองมือ แนบศอกกับลำตัว หรือพิงสิ่งของ ใช้ชัตเตอร์เร็วขึ้น (เพิ่มแสง) และถ่ายต่อเนื่องหลายภาพแล้วเลือกภาพที่คมที่สุด"
          : "แตะหน้าจอที่ตัวแบบให้กล้องโฟกัสก่อนถ่าย รอให้กรอบโฟกัสนิ่ง และเช็ดเลนส์",
        edit: "เพิ่ม Sharpening ได้เล็กน้อย แต่แก้ภาพเบลอมากให้คมจริงไม่ได้", principles: directional ? ["shutter_speed", "intent_vs_error"] : ["focus_lock"] });
    } else if (noisy) {
      // noise looks like fine detail to the meter → never call a noisy image "sharp"
      if (slowShutter) push({ dim: "focus", kind: "issue", title: "เสี่ยงภาพเบลอจากชัตเตอร์ช้า",
        evidence: `ข้อมูลกล้องระบุชัตเตอร์ ${fmtShutter(slow)} (ถือมือควรเร็วกว่าประมาณ 1/${Math.round(1 / safe)} วินาที) และภาพมีนอยส์มากจนเครื่องวัดความคมไม่ได้แน่ชัด`,
        cause: "แสงน้อย กล้องจึงเปิดชัตเตอร์นาน ถ้ามือสั่นหรือตัวแบบขยับในช่วงนั้น ภาพจะเบลอ", confidence: "ปานกลาง", possible: ["กล้องสั่น", "ตัวแบบขยับ", "ภาพอาจยังคมถ้าทั้งคู่นิ่งสนิท"],
        fix: "เพิ่มแสงในฉากเพื่อให้กล้องใช้ชัตเตอร์เร็วขึ้น ถือกล้องให้นิ่ง และถ่ายต่อเนื่องหลายภาพ", edit: "ลดนอยส์ก่อน แล้วค่อยเพิ่มความคมเล็กน้อย", principles: ["shutter_speed", "iso_noise"] });
      push({ dim: "focus", kind: "note", title: "วัดความคมได้ไม่แน่ชัด", evidence: `นอยส์ในภาพค่อนข้างมาก (ระดับ ${m.noise.viewSigma}) ทำให้เครื่องวัดเห็นเม็ดนอยส์เป็นรายละเอียด`, cause: "", confidence: "ต่ำ", fix: "", edit: "", principles: [] });
    } else {
      const uneven = s.medianIndex < s.index * 0.45;
      // the meter cannot tell WHICH part is the subject — never claim "the subject is sharp" from pixels alone
      push({ dim: "focus", kind: "good", title: uneven ? "มีบางส่วนของภาพที่คมชัด" : "ภาพคมชัดทั่วทั้งภาพ",
        evidence: `ค่าความคมของส่วนที่คมที่สุด ${s.index}` + (uneven ? `, ส่วนอื่นเฉลี่ย ${s.medianIndex}` : ""), principles: [] });
      if (uneven) push({ dim: "focus", kind: "note", title: "เช็กว่าส่วนที่คมคือตัวแบบหรือเปล่า",
        evidence: "ความคมไม่เท่ากันทั้งภาพ ซึ่งอาจเป็นฉากหลังละลายที่ดี หรืออาจเป็นตัวแบบเบลอแต่พื้นคมก็ได้ — กดปุ่ม \"แผนที่ความคม\" บนภาพเพื่อดูว่าส่วนสีเขียวเข้มอยู่ที่หน้าหรือดวงตาของตัวแบบไหม",
        cause: "เครื่องวัดรู้ว่าส่วนไหนคม แต่ไม่รู้ว่าส่วนไหนคือตัวแบบ", confidence: "ต่ำ", fix: "แตะโฟกัสที่ดวงตาของตัวแบบก่อนกดถ่าย ถ้าตัวแบบขยับเร็ว ให้ถ่ายต่อเนื่องหลายภาพ", edit: "", principles: ["focus_lock"] });
      if (slowShutter) push({ dim: "focus", kind: "note", title: "ชัตเตอร์ค่อนข้างช้า", evidence: `${fmtShutter(slow)} (ค่าที่ปลอดภัยโดยประมาณสำหรับถือมือคือเร็วกว่า 1/${Math.round(1 / safe)})`, cause: "ภาพนี้ยังดูคม แต่ครั้งหน้าระวังภาพสั่น", confidence: "สูง", fix: "", edit: "", principles: ["shutter_speed"] });
    }
    const unevenSharp = Fs > 3 && s.medianIndex < s.index * 0.45;
    scores.focus = noisy && Fs > 3 ? (slowShutter ? 3 : null) : unevenSharp ? null : Fs; // can't confirm the SUBJECT is the sharp part

    // ---- colour
    let C = 4;
    if (c.grayscale) push({ dim: "color", kind: "note", title: "ภาพขาวดำ", evidence: "ไม่พบสีในภาพ", cause: "", confidence: "สูง", fix: "", edit: "", principles: [] });
    else {
      if (c.oversaturatedPct > 40) { C = 3; push({ dim: "color", kind: "issue", title: "สีจัดจนอาจดูไม่เป็นธรรมชาติ", evidence: `พิกเซลที่สีอิ่มเกือบเต็มที่มี ${c.oversaturatedPct}% ของภาพ`, cause: "ฟิลเตอร์หรือการเร่งสีมากเกินไป หรือแสงสีจัดในสถานที่", confidence: "ปานกลาง", fix: "ปิดฟิลเตอร์สีจัดในกล้อง", edit: "ลด Saturation หรือใช้ Vibrance แทน", principles: ["color_mood"] }); }
      else if (c.oversaturatedPct > 20) push({ dim: "color", kind: "note", title: "สีสดจัด", evidence: `${c.oversaturatedPct}% ของภาพมีสีอิ่มมาก`, cause: "อาจมาจากวัตถุสีสดในภาพ", confidence: "ปานกลาง", fix: "", edit: "", principles: [] });
      if (c.castReliable && Math.abs(c.castWarmth) > 0.3) {
        C = Math.min(C, 3);
        const warm = c.castWarmth > 0;
        push({ dim: "color", kind: "issue", title: warm ? "ภาพติดโทนส้ม/เหลือง" : "ภาพติดโทนฟ้า",
          evidence: `ส่วนที่ควรเป็นสีขาว/เทา (${c.neutralPct}% ของภาพ) มีสี${warm ? "อุ่น" : "เย็น"}ปน`,
          cause: warm ? "ไฟหลอดสีส้มหรือแสงเย็นยามเย็น" : "ร่มเงาหรือแสงจากหน้าต่างช่วงฟ้าครึ้ม", confidence: "ปานกลาง",
          fix: "ถ้าไม่ได้ตั้งใจ ให้ตั้ง White Balance (สมดุลแสงขาว) ให้ตรงกับแหล่งแสง", edit: "ปรับ Temperature/White Balance", principles: ["white_balance", "intent_vs_error"] });
      }
      if (c.saturation < 0.08) { C = Math.min(C, 3); push({ dim: "color", kind: "note", title: "สีค่อนข้างซีด", evidence: `ความอิ่มสีเฉลี่ย ${c.saturation}`, cause: "แสงทึบ หมอก หรือย้อนแสง", confidence: "ปานกลาง", fix: "", edit: "เพิ่ม Vibrance เล็กน้อย", principles: ["color_mood"] }); }
    }
    scores.color = C;

    // ---- technical
    let T = 5;
    const sig = Math.max(m.noise.viewSigma, (m.detail && m.detail.noiseSigma) || 0);
    if (sig > 8) T = 1; else if (sig > 5) T = 2; else if (sig > 3) T = 3; else if (sig > 1.8) T = 4;
    if (T <= 3) {
      const isoTxt = ex && ex.iso ? ` ข้อมูลกล้องระบุ ISO ${ex.iso}` : "";
      push({ dim: "technical", kind: "issue", title: "มีเม็ดนอยส์ (จุดสีหยาบ) ชัดเจน",
        evidence: `ระดับนอยส์ที่วัดได้ ${+sig.toFixed(1)} (ภาพสะอาดมักต่ำกว่า 1.8)` + isoTxt,
        cause: ex && ex.iso >= 1600 ? "ISO (ความไวแสง) สูงเพราะแสงน้อย" : "แสงน้อยทำให้กล้องเร่งความไวแสง หรือภาพถูกเร่งความสว่างภายหลัง", confidence: ex && ex.iso ? "สูง" : "ปานกลาง",
        fix: "เพิ่มแสงในฉาก หรือวางกล้องให้นิ่งเพื่อให้กล้องใช้ ISO ต่ำลงได้", edit: "ใช้ Noise Reduction ระดับกลาง (มากไปผิวจะเนียนเหมือนพลาสติก)", principles: ["iso_noise"] });
    }
    const long = Math.max(meta.origW || 0, meta.origH || 0);
    if (long && long < 1200) { T = Math.min(T, 4); push({ dim: "technical", kind: "note", title: "ความละเอียดภาพต่ำ", evidence: `${meta.origW}×${meta.origH} พิกเซล`, cause: "ภาพอาจถูกย่อหรือส่งต่อผ่านแอปแชต", confidence: "สูง", fix: "ส่งไฟล์ต้นฉบับจากกล้องเพื่อการวิเคราะห์ที่แม่นขึ้น", edit: "", principles: [] }); }
    if (T >= 4 && sig <= 1.8) push({ dim: "technical", kind: "good", title: "ภาพสะอาด นอยส์น้อย", evidence: `ระดับนอยส์ ${+sig.toFixed(1)}`, principles: [] });
    scores.technical = T;

    // composition & story need semantic understanding → not scored locally
    scores.composition = null;
    scores.story = null;
    return { findings: F, scores };
  }

ดูภาพที่แนบมา แล้ววิเคราะห์ 6 ด้าน: composition (องค์ประกอบ), lighting (แสงและการเปิดรับแสง), focus (โฟกัส/ความคม/ภาพสั่น), color (สี White Balance คอนทราสต์ อารมณ์), story (การเล่าเรื่อง ความหมาย ความตั้งใจ), technical (นอยส์ รายละเอียด ข้อจำกัดอุปกรณ์)

กติกาสำคัญ:
1. ทุกคำชมและคำติต้องมี "หลักฐาน" ที่ชี้ไปยังสิ่งที่มองเห็นในภาพได้จริง (ตำแหน่ง วัตถุ สี แสง) ห้ามชมลอย ๆ
2. ห้ามเดาค่าเทคนิคของกล้อง ถ้า exif เป็น NO_EXIF หรือค่าเป็น null ให้บอกว่าตรวจสอบไม่ได้ ห้ามสร้างตัวเลขเอง
3. แยกข้อผิดพลาดทางเทคนิคออกจากความตั้งใจเชิงศิลปะ เช่น ภาพเบลอจากการเคลื่อนไหว ภาพมืด หรือสีจัด อาจเป็นความตั้งใจ ให้บอกเงื่อนไขว่าเมื่อไหร่ถือว่าตั้งใจ
4. เมื่อพูดถึงสาเหตุของภาพเบลอ ถ้าแยกไม่ได้ว่าเกิดจากกล้องสั่น ตัวแบบขยับ หรือโฟกัสผิด ให้ใส่ทุกความเป็นไปได้และระดับความมั่นใจ (สูง/ปานกลาง/ต่ำ)
5. คำแนะนำต้องเหมาะกับประเภทภาพ (ภาพคน สัตว์เลี้ยง วิว อาหาร สตรีท กลางคืน) และทำได้จริงด้วยโทรศัพท์
6. ใช้ภาษาไทยสุภาพ เป็นธรรมชาติ ประโยคสั้น ถ้าต้องใช้ศัพท์เทคนิคให้อธิบายในวงเล็บ เช่น ISO (ความไวแสง)
7. ถ้าค่าที่วัดได้ขัดกับสิ่งที่คุณเห็น ให้เชื่อสิ่งที่เห็นในภาพ แต่บอกเหตุผลสั้น ๆ
8. คะแนนเป็นจำนวนเต็ม 1–5 (1 = ต้องแก้มาก, 3 = พอใช้, 5 = ดีมาก) ให้ใจกว้างกับภาพจากคนทั่วไปแต่ไม่ให้คะแนนเกินจริง · แอปแสดงค่านี้เป็น "ดาว" เพื่อช่วยฝึก ไม่ใช่คะแนนในชั้นเรียน ดังนั้นในข้อความทุกช่อง (รวม note) ห้ามเขียนตัวเลขคะแนน ห้ามใช้คำว่า "คะแนน" หรือ "เกรด" และห้ามพูดว่างานจะได้คะแนนเท่าไร
9. ถ้าในภาพมีบุคคล อย่าระบุตัวตน และอย่าวิจารณ์รูปร่างหน้าตาของบุคคล ให้พูดถึงการถ่ายภาพเท่านั้น
10. บอกตำแหน่งให้เจาะจง ทั้ง "ในภาพ" (เช่น มุมซ้ายบน ใบหน้า ดวงตา ฉากหลังด้านขวา) และ "ในสถานที่จริง" (เช่น ให้หน้าต่างอยู่ด้านซ้ายของตัวแบบ เปิดไฟเพดานเพิ่ม หันตัวแบบเข้าหาแสง ย่อตัวลงระดับสายตาสัตว์ ถอยหลังหนึ่งก้าว) ห้ามแนะนำกว้าง ๆ เช่น "เพิ่มแสง" โดยไม่บอกว่าเพิ่มจากทางไหนและทำอย่างไรด้วยของที่มีอยู่

งานของคุณ:
1. ดูทุกภาพ แล้วหา "รูปแบบ" ที่เกิดซ้ำ: ผู้ใช้ถ่ายได้ดีในสถานการณ์ไหน และพลาดซ้ำเรื่องอะไร (เช่น ในร่มมักมืดและนอยส์ ย้อนแสงหน้ามืด ถือกล้องเอียง ตัวแบบอยู่กลางภาพตลอด) อ้างหมายเลขภาพเป็นหลักฐาน
2. ให้คำแนะนำสั้นรายภาพ บอกตำแหน่งให้เจาะจงทั้งในภาพ (เช่น ใบหน้า มุมขวาล่าง) และในสถานที่จริง (เช่น ให้หน้าต่างอยู่ด้านซ้าย เปิดไฟเพดาน ย่อตัวลงระดับสายตาสัตว์)
3. แยกข้อผิดพลาดทางเทคนิคออกจากความตั้งใจเชิงศิลปะ ห้ามเดาค่ากล้องที่ไม่มีข้อมูล ห้ามชมหรือติโดยไม่มีหลักฐานในภาพ
4. ถ้ามีบุคคล อย่าระบุตัวตนและอย่าวิจารณ์รูปร่างหน้าตา พูดถึงการถ่ายภาพเท่านั้น
5. ภาษาไทยสุภาพ เป็นธรรมชาติ พูดกับผู้ใช้โดยตรง อธิบายศัพท์เทคนิคในวงเล็บ

 "overall_message": "ข้อความ 4–7 ประโยค พูดกับผู้ใช้แบบเพื่อน สรุปภาพรวมของทั้งชุด",

}
score คือจำนวนดาวรวม 1–5 (แอปแสดงเป็นดาวเพื่อช่วยฝึก ไม่ใช่คะแนนในชั้นเรียน) ต้องมีครบทุกภาพ ${items.length} รายการ, recurring_issues 1–3 ข้อ, strong_when 1–3 ข้อ · ในข้อความทุกช่องห้ามเขียนตัวเลขคะแนน ห้ามใช้คำว่า "คะแนน" หรือ "เกรด"`;
  }
  /* chat with Buddy about the current photo — memoryless, so the context travels with every call */
  function buildChatMessages({ photo, history, question }) {
    const ctx = photo ? {
      genre: photo.genre, measurements: compactMetrics(photo.metrics, photo.exif),
      analysis: photo.ai ? { summary: photo.ai.summary, scores: Object.fromEntries(Object.entries(photo.ai.scores).map(([k, v]) => [k, v.score])), strengths: photo.ai.strengths.map((s) => s.text), improvements: photo.ai.improvements.map((x) => x.issue + " — " + x.how_to_fix), shooting_setup: photo.ai.shooting_setup } : "ยังไม่มีผลจาก AI มีแต่ค่าที่เครื่องวัด",
    } : "ผู้ใช้ยังไม่ได้ส่งภาพ";
    const rules = `คุณคือ "บัดดี้" แมวจาก Camera Buddy เพื่อนที่ถ่ายภาพเก่ง ใจดี เป็นกันเอง แต่ซื่อตรง คุยกับผู้ใช้ที่เป็นคนทั่วไป/นักศึกษาที่ถ่ายด้วยโทรศัพท์
กติกา: ตอบภาษาไทย สั้น อ่านง่าย (ไม่เกิน 5 ประโยค หรือ bullet ไม่เกิน 4 ข้อ) · คุยเฉพาะเรื่องการถ่ายภาพ/แต่งภาพ ถ้าถามเรื่องอื่นให้ชวนกลับมาเรื่องภาพอย่างสุภาพ · บอกตำแหน่งให้เจาะจงทั้งในภาพและในสถานที่จริง (แสงมาจากทางไหน ยืนตรงไหน แตะโฟกัสตรงไหน) · ห้ามเดาค่ากล้องที่ไม่มีข้อมูล · ห้ามชมหรือติโดยไม่มีหลักฐานในภาพ · ถ้ามีบุคคลในภาพ อย่าระบุตัวตนหรือวิจารณ์รูปร่างหน้าตา · ไม่ใช้อีโมจิ · ตอบเป็นข้อความธรรมดา ไม่ใช้ markdown หัวข้อ · ห้ามบอกว่างานจะได้คะแนนหรือเกรดเท่าไร ถ้าผู้ใช้ถามเรื่องคะแนน ให้บอกว่าดาวในแอปเป็นแค่ตัวช่วยฝึก เทียบกับคะแนนในชั้นเรียนไม่ได้ เพราะการให้คะแนนงานมีปัจจัยอื่น และอาจารย์อาจเห็นต่างได้
ข้อมูลภาพปัจจุบัน (ภาพแนบมาด้วยถ้ามี): ${JSON.stringify(ctx)}`;
    const msgs = [];
    (history || []).forEach((m, i) => msgs.push({ role: m.role, content: i === 0 && m.role === "user" ? rules + "\n\nข้อความจากผู้ใช้: " + m.content : m.content }));
    msgs.push({ role: "user", content: msgs.length ? question : rules + "\n\nข้อความจากผู้ใช้: " + question });
    return msgs;
  }

  function normalizeBatch(j, n) {
    const arr = (x) => (Array.isArray(x) ? x : []);
    const photos = arr(j.photos).map((p) => ({ n: Math.round(Number(p.n)) || 0, genre: GENRES[p.genre] ? p.genre : "other", title: String(p.title || ""), score: clampScore(p.score), good: String(p.good || ""), fix: String(p.fix || ""), first_action: String(p.first_action || "") })).filter((p) => p.n >= 1 && p.n <= n);
    return { overall_message: String(j.overall_message || ""), strong_when: arr(j.strong_when).map(String).slice(0, 4),
      recurring_issues: arr(j.recurring_issues).slice(0, 4).map((x) => ({ issue: String(x.issue || ""), images: arr(x.images).map(Number).filter((k) => k >= 1 && k <= n), why: String(x.why || ""), fix: String(x.fix || "") })),
      practice_plan: arr(j.practice_plan).map(String).slice(0, 5), photos };
  }

  function parseJSON(text) {
    if (!text) throw new Error("empty");
    let t = String(text).trim().replace(/^```(?:json)?/i, "").replace(/```$/, "");
    const a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a < 0 || b < a) throw new Error("no JSON object");
    return JSON.parse(t.slice(a, b + 1));
  }
  function clampScore(x) { const n = Math.round(Number(x)); return n >= 1 && n <= 5 ? n : null; }
  function normalizeAnalysis(j) {
    const ss = j.shooting_setup && typeof j.shooting_setup === "object" ? j.shooting_setup : {};
    const out = { genre: GENRES[j.genre] ? j.genre : "other", summary: String(j.summary || ""), coach_message: String(j.coach_message || ""),
      shooting_setup: { light: String(ss.light || ""), position: String(ss.position || ""), focus: String(ss.focus || ""), camera: String(ss.camera || "") },
      scores: {}, strengths: [], improvements: [],
      intent_note: String(j.intent_note || ""), reshoot_first: j.reshoot_first || null, reshoot_steps: Array.isArray(j.reshoot_steps) ? j.reshoot_steps.map(String).slice(0, 6) : [],
      edit_tips: Array.isArray(j.edit_tips) ? j.edit_tips.map(String).slice(0, 5) : [], principles: Array.isArray(j.principles) ? j.principles.filter((k) => PRINCIPLE_KEYS.includes(k)).slice(0, 5) : [], exif_note: String(j.exif_note || "") };
    for (const d of Object.keys(DIMS)) { const v = j.scores && j.scores[d]; out.scores[d] = v ? { score: clampScore(v.score ?? v), note: String(v.note || "") } : { score: null, note: "" }; }
    if (Array.isArray(j.strengths)) out.strengths = j.strengths.slice(0, 5).map((x) => ({ dim: DIMS[x.dim] ? x.dim : "composition", text: String(x.text || ""), evidence: String(x.evidence || "") }));
    if (Array.isArray(j.improvements)) out.improvements = j.improvements.slice(0, 4).map((x) => ({ dim: DIMS[x.dim] ? x.dim : "composition", issue: String(x.issue || ""), evidence: String(x.evidence || ""), cause: String(x.cause || ""), confidence: ["สูง", "ปานกลาง", "ต่ำ"].includes(x.confidence) ? x.confidence : "ปานกลาง", possible_causes: Array.isArray(x.possible_causes) ? x.possible_causes.map(String).slice(0, 4) : [], how_to_fix: String(x.how_to_fix || "") }));
    return out;
  }

  /* ---------- usage limiter (per browser) ---------- */
  const LIMITS = { perHour: 10, perDay: 30, minGapSec: 15 };
  const memLog = [];
  function readLog() { try { return JSON.parse(localStorage.getItem("pc_ai_log") || "[]"); } catch (e) { return memLog.slice(); } }
  function writeLog(a) { try { localStorage.setItem("pc_ai_log", JSON.stringify(a)); } catch (e) { memLog.length = 0; memLog.push(...a); } }
  function quota() {
    const now = Date.now();
    const log = readLog().filter((t) => now - t < 864e5);
    const hour = log.filter((t) => now - t < 36e5).length;
    const last = log.length ? Math.max(...log) : 0;
    const waitSec = Math.max(0, Math.ceil((last + LIMITS.minGapSec * 1000 - now) / 1000));
    let ok = true, reason = "";
    if (log.length >= LIMITS.perDay) { ok = false; reason = `ใช้ AI ครบ ${LIMITS.perDay} ครั้งของวันนี้แล้ว (ตั้งไว้เพื่อไม่ให้โควตาฟรีหมด) — ยังวิเคราะห์ด้วยเครื่องวัดในเครื่องได้ตามปกติ`; }
    else if (hour >= LIMITS.perHour) { ok = false; reason = `ใช้ AI ครบ ${LIMITS.perHour} ครั้งในชั่วโมงนี้แล้ว ลองใหม่ภายหลัง — ระหว่างนี้ยังวิเคราะห์ด้วยเครื่องวัดในเครื่องได้`; }
    else if (waitSec > 0) { ok = false; reason = `รออีก ${waitSec} วินาทีก่อนใช้ AI ครั้งถัดไป`; }
    // seconds until one more AI use becomes available (for the "rest" screen; does not change the limits)
    let freeInSec = waitSec;
    if (log.length >= LIMITS.perDay) freeInSec = Math.max(0, Math.ceil((Math.min(...log) + 864e5 - now) / 1000));
    else if (hour >= LIMITS.perHour) freeInSec = Math.max(0, Math.ceil((Math.min(...log.filter((t) => now - t < 36e5)) + 36e5 - now) / 1000));
    return { ok, reason, usedToday: log.length, usedHour: hour, limits: LIMITS, waitSec, freeInSec, kind: log.length >= LIMITS.perDay ? "day" : hour >= LIMITS.perHour ? "hour" : waitSec > 0 ? "gap" : "" };
  }
  function recordUse(weight = 1) { const log = readLog().filter((t) => Date.now() - t < 864e5); for (let i = 0; i < weight; i++) log.push(Date.now() + i); writeLog(log); }
  function clearUsage() { writeLog([]); try { localStorage.removeItem("pc_ai_log"); } catch (e) {} }

  /* ---------- AI adapters ---------- */
  const AI = { kind: "none", sample: null, imagesOK: false, gemini: null, puter: false, puterUser: "", puterModel: "" };
  try { AI.puterModel = localStorage.getItem("cb_puter_model") || ""; } catch (e) {}
  const hasPuter = () => typeof window !== "undefined" && window.puter && window.puter.auth && window.puter.ai;
  /* Puter (User-Pays): each user signs in with their own Puter account; AI cost comes from that account. */
  async function refreshPuter() {
    AI.puter = !!hasPuter();
    let signed = false;
    try { signed = AI.puter && window.puter.auth.isSignedIn(); } catch (e) { signed = false; }
    if (signed) {
      try { const u = await window.puter.auth.getUser(); AI.puterUser = (u && u.username) || ""; } catch (e) { AI.puterUser = ""; }
      if (AI.kind === "none" || AI.kind === "puter") AI.kind = "puter";
    } else if (AI.kind === "puter") { AI.kind = "none"; AI.puterUser = ""; }
    return signed;
  }
  async function signInPuter() { await window.puter.auth.signIn(); return refreshPuter(); } // must be called from a tap
  async function signOutPuter() { try { window.puter.auth.signOut(); } catch (e) {} AI.puterUser = ""; if (AI.kind === "puter") AI.kind = "none"; }
  function setPuterModel(m) { AI.puterModel = m || ""; try { m ? localStorage.setItem("cb_puter_model", m) : localStorage.removeItem("cb_puter_model"); } catch (e) {} }
  async function puterUsage() { try { const u = await window.puter.auth.getMonthlyUsage(); return (u && u.allowanceInfo) || u || null; } catch (e) { return null; } }
  async function puterModels() {
    try { const l = await window.puter.ai.listModels(); return (l || []).map((m) => (typeof m === "string" ? m : m.id)).filter(Boolean); } catch (e) { return []; }
  }
  function raceAbort(pr, signal) {
    if (!signal) return pr;
    return new Promise((res, rej) => {
      const onAbort = () => { const e = new Error("aborted"); e.name = "AbortError"; rej(e); };
      if (signal.aborted) return onAbort();
      signal.addEventListener("abort", onAbort, { once: true });
      pr.then(res, rej).finally(() => signal.removeEventListener("abort", onAbort));
    });
  }
  function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(b); }); }
  function puterText(r) {
    if (!r) return "";
    if (typeof r === "string") return r;
    const c = r.message && r.message.content;
    if (typeof c === "string") return c;
    if (Array.isArray(c)) return c.map((p) => p.text || "").join("");
    return r.text || "";
  }
  async function initAI() {
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const smp = await window.claude.use("sample");
        if (smp) {
          AI.sample = smp;
          try { const lim = smp.limits ? await smp.limits() : null; AI.imagesOK = !!(lim && lim.images); } catch (e) { AI.imagesOK = false; }
          if (AI.imagesOK) AI.kind = "claude";
        }
      }
    } catch (e) { /* not on claude.ai — stay local */ }
    if (AI.kind === "none") await refreshPuter();
    if (AI.kind === "none") {
      try { const g = JSON.parse(sessionStorage.getItem("pc_gemini") || "null"); if (g && g.key) { AI.gemini = g; AI.kind = "gemini"; } } catch (e) {}
    }
    return AI.kind;
  }
  function setGemini(key, model) {
    AI.gemini = key ? { key, model: model || "gemini-2.5-flash" } : null;
    AI.kind = key ? "gemini" : (AI.sample && AI.imagesOK ? "claude" : "none");
    try { key ? sessionStorage.setItem("pc_gemini", JSON.stringify(AI.gemini)) : sessionStorage.removeItem("pc_gemini"); } catch (e) {}
  }
  function blobToBase64(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); }); }

  async function callAI(prompt, blobs, { signal, onProgress, weight = 1 } = {}) {
    const q = quota();
    if (q.ok && weight > 1 && (q.limits.perHour - q.usedHour < weight || q.limits.perDay - q.usedToday < weight)) { q.ok = false; q.reason = `ภาพชุดนี้นับเป็น ${weight} ครั้ง แต่โควตาที่เหลือไม่พอ ลองส่งภาพน้อยลง หรือรอสักพัก — ระหว่างนี้ยังวิเคราะห์ด้วยเครื่องวัดในเครื่องได้`; }
    if (!q.ok) { const err = new Error(q.reason); err.code = "local_quota"; throw err; }
    if (AI.kind === "claude") {
      recordUse(weight);
      try {
        const r = await AI.sample(prompt, { images: blobs, modelTier: "default", cache: true, signal, onText: onProgress ? ({ text }) => onProgress(text) : undefined });
        return { text: r.text, truncated: !!r.truncated, engine: "Claude (claude.ai sample)", model: r.modelApplied || r.model || "ไม่ระบุโดยระบบ (modelTier: default)" };
      } catch (e) {
        const err = new Error(e && e.message ? e.message : "AI error"); err.code = e && e.code ? e.code : "ai_error"; throw err;
      }
    }
    if (AI.kind === "puter") {
      recordUse(weight);
      const opts = AI.puterModel ? { model: AI.puterModel } : {};
      let r;
      try {
        if (!Array.isArray(prompt) && blobs.length === 1) {
          // single photo: passed as a File (the path tested on a real phone in step 1)
          const f = blobs[0] instanceof File ? blobs[0] : new File([blobs[0]], "photo.jpg", { type: blobs[0].type || "image/jpeg" });
          r = await raceAbort(window.puter.ai.chat(prompt, f, false, opts), signal);
        } else {
          // several photos or a chat history: OpenAI-style messages with images as data URLs on the last user turn
          const imgs = [];
          for (const b of blobs) imgs.push({ type: "image_url", image_url: { url: await blobToDataURL(b) } });
          const msgs = Array.isArray(prompt) ? prompt.map((m) => ({ role: m.role, content: m.content })) : [{ role: "user", content: prompt }];
          const last = msgs[msgs.length - 1];
          if (imgs.length) last.content = [{ type: "text", text: String(last.content) }].concat(imgs);
          r = await raceAbort(window.puter.ai.chat(msgs, false, opts), signal);
        }
      } catch (e) {
        if (e && e.name === "AbortError") throw e;
        const msg = (e && (e.message || (e.error && e.error.message) || e.error)) || (typeof e === "string" ? e : JSON.stringify(e));
        const err = new Error(String(msg)); err.raw = msg;
        err.code = /insufficient|funds|credit|balance|upgrade|402/i.test(msg) ? "puter_credit" : /429|rate/i.test(msg) ? "rate_limited" : /sign|auth|401/i.test(msg) ? "not_granted" : "ai_error";
        throw err;
      }
      const text = puterText(r);
      if (!text) { const err = new Error("AI ตอบกลับมาว่างเปล่า"); err.code = "ai_error"; throw err; }
      return { text, truncated: false, engine: "Puter (บัญชีของผู้ใช้)", model: (r && r.message && r.message.model) || AI.puterModel || "ค่าเริ่มต้นของ Puter" };
    }
    if (AI.kind === "gemini") {
      recordUse(weight);
      const imgs = [];
      for (const b of blobs) imgs.push({ inline_data: { mime_type: b.type || "image/jpeg", data: await blobToBase64(b) } });
      const contents = Array.isArray(prompt)
        ? prompt.map((m, i) => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }].concat(i === prompt.length - 1 ? imgs : []) }))
        : [{ role: "user", parts: [{ text: prompt }].concat(imgs) }];
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(AI.gemini.model)}:generateContent`, {
        method: "POST", signal, headers: { "Content-Type": "application/json", "x-goog-api-key": AI.gemini.key },
        body: JSON.stringify({ contents, generationConfig: Array.isArray(prompt) ? { temperature: 0.6 } : { temperature: 0.4, responseMimeType: "application/json" } }),
      });
      if (res.status === 429) { const err = new Error("โควตาฟรีของ API Key นี้หมดชั่วคราว"); err.code = "rate_limited"; throw err; }
      if (!res.ok) { const err = new Error(`Gemini ตอบกลับ ${res.status}`); err.code = "ai_error"; throw err; }
      const j = await res.json();
      const text = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts ? j.candidates[0].content.parts.map((p) => p.text || "").join("") : "";
      return { text, truncated: false, engine: "Gemini (คีย์ของผู้ใช้)", model: j.modelVersion || AI.gemini.model };
    }
    const err = new Error("ยังไม่ได้เชื่อมต่อ AI"); err.code = "no_ai"; throw err;
  }

  function aiErrorMessage(e) {
    const code = e && e.code;

    if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return "image/webp";
    const s = String.fromCharCode.apply(null, Array.from(b.slice(4, 12)));
    if (/^ftyp(heic|heix|hevc|heim|heis|mif1|msf1)/.test(s)) return "image/heic";
    if (/^ftypavi/.test(s)) return "image/avif";
    if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return "image/gif";
    return "";
  }
  async function decode(file) {
    if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) {} }
    const url = URL.createObjectURL(file);
    try { const img = new Image(); img.src = url; await img.decode(); return img; } catch (e) { return null; } finally { URL.revokeObjectURL(url); }
  }
  const canvasOf = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  async function prepare(file, aiMax = 1280) {
    // Android galleries often report an empty or odd file.type, so the real format is read from the file's first bytes.
    if (file.size > MAX_BYTES) throw new Error("ไฟล์ใหญ่เกิน 20 MB");
    const buf = await file.arrayBuffer();
    const type = sniffType(buf) || file.type || "";
    const isHeic = /heic|heif/i.test(type + " " + (file.name || ""));
    let exif = {};
    try { exif = PCEngine.readExif(buf) || {}; } catch (e) {}
    let bmp;
    try { bmp = await decode(new Blob([buf], { type: type || "application/octet-stream" })); } catch (e) { bmp = null; }
    if (!bmp) throw new Error(isHeic ? "เครื่องนี้เปิดไฟล์ HEIC ไม่ได้ ลองตั้งกล้องให้บันทึกเป็น JPG หรือแคปหน้าจอรูปนั้นแล้วเลือกใหม่" : "เปิดไฟล์ภาพนี้ไม่ได้ ลองเลือกรูปอื่น หรือบันทึกรูปเป็น JPG ก่อน");
    const W = bmp.width || bmp.naturalWidth, H = bmp.height || bmp.naturalHeight;
    if (!W || !H) throw new Error("เปิดไฟล์ภาพนี้ไม่ได้");
    const k = Math.min(1, 1024 / Math.max(W, H));
    const vw = Math.max(1, Math.round(W * k)), vh = Math.max(1, Math.round(H * k));
    const vc = canvasOf(vw, vh), vx = vc.getContext("2d", { willReadFrequently: true });
    vx.imageSmoothingQuality = "high"; vx.drawImage(bmp, 0, 0, vw, vh);
    const view = vx.getImageData(0, 0, vw, vh);
    const pre = PCEngine.analyze(view, null);
    const cs = Math.min(768, W, H);
    const cx = Math.round(Math.min(Math.max(pre.composition.subjectGuess.x * W - cs / 2, 0), W - cs));
    const cy = Math.round(Math.min(Math.max(pre.composition.subjectGuess.y * H - cs / 2, 0), H - cs));
    const dc = canvasOf(cs, cs), dx = dc.getContext("2d", { willReadFrequently: true });
    dx.drawImage(bmp, cx, cy, cs, cs, 0, 0, cs, cs);
    const metrics = PCEngine.analyze(view, dx.getImageData(0, 0, cs, cs));
    const ka = Math.min(1, aiMax / Math.max(W, H));
    const ac = canvasOf(Math.round(W * ka), Math.round(H * ka));
    ac.getContext("2d").drawImage(bmp, 0, 0, ac.width, ac.height);
    const blob = await new Promise((res) => ac.toBlob(res, "image/jpeg", 0.85));
    if (bmp.close) bmp.close();
    return { name: file.name || "ภาพ", bytes: file.size, type: type, origW: W, origH: H, exif, view, metrics, blob, url: track(URL.createObjectURL(blob)) };
  }

      const t0 = new Date();
      try {
        const r = await PCCoach.callAI(prompt, [photo.blob], { signal: busyAbort.signal });
        photo.ai = PCCoach.normalizeAnalysis(PCCoach.parseJSON(r.text));
        photo.aiMeta = { engine: r.engine, model: r.model, promptVersion: PCCoach.PROMPT_VERSION, date: t0.toISOString(), seconds: Math.round((Date.now() - t0) / 1000), raw: r.text };

        photo.aiMeta = { engine: PCCoach.AI.kind, model: null, promptVersion: PCCoach.PROMPT_VERSION, date: t0.toISOString(), error: (e && (e.code || e.message)) || "error" };

    } else if (useAI()) photo.aiError = PCCoach.aiErrorMessage({ code: "no_ai" });
    photo.genre = photo.genreChosen !== "auto" ? photo.genreChosen : (photo.ai && photo.ai.genre) || "other";

  async function runBatch(files) {

  function bindOverlay(p) {
    const cv = $("#ov"); if (!cv) return;
    const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, m = p.metrics;
    const legends = { none: "", grid: "เส้นแบ่งสามส่วน · วงกลมประ = บริเวณที่เครื่องคาดว่าเป็นจุดสนใจ (ความมั่นใจต่ำ)", clip: "สีแดง = สว่างจนเป็นสีขาวล้วน · สีฟ้า = มืดจนเป็นสีดำล้วน", focus: "สีเขียวเข้ม = คมมาก · กรอบอำพัน = บริเวณที่คมที่สุด (เครื่องวัดไม่รู้ว่าส่วนไหนคือตัวแบบ)" };
    function draw(mode) {
      ctx.clearRect(0, 0, W, H);
      $("#ovLegend").textContent = legends[mode] + (mode === "focus" && m.noise.viewSigma > 2.5 ? " — ภาพนี้นอยส์มาก แผนที่อาจคลาดเคลื่อน" : "");
      if (mode === "grid") {
        ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = Math.max(1, W / 500);
        for (const fr of [1 / 3, 2 / 3]) { ctx.beginPath(); ctx.moveTo(W * fr, 0); ctx.lineTo(W * fr, H); ctx.moveTo(0, H * fr); ctx.lineTo(W, H * fr); ctx.stroke(); }
        const s = m.composition.subjectGuess; ctx.setLineDash([8, 6]); ctx.strokeStyle = "#FFC845"; ctx.lineWidth = Math.max(2, W / 300);
        ctx.beginPath(); ctx.arc(s.x * W, s.y * H, Math.min(W, H) * 0.12, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      } else if (mode === "clip") {
        const src = p.view.data, out = ctx.createImageData(W, H), o = out.data;
        for (let i = 0; i < src.length; i += 4) { const y = 0.2126 * src[i] + 0.7152 * src[i + 1] + 0.0722 * src[i + 2];
          if (y >= 250) { o[i] = 239; o[i + 1] = 68; o[i + 2] = 68; o[i + 3] = 210; } else if (y <= 5) { o[i] = 59; o[i + 1] = 130; o[i + 2] = 246; o[i + 3] = 210; } }
        ctx.putImageData(out, 0, 0);
      } else if (mode === "focus") {
        const [gx, gy] = m.sharp.sharpestTile.grid, map = m.sharp.focusMap, mx = Math.max(...map, 0.01);
        map.forEach((val, i) => { const tx = i % gx, ty = Math.floor(i / gx), a = Math.min(1, val / mx); ctx.fillStyle = `rgba(94,122,51,${(0.08 + a * 0.55).toFixed(2)})`; ctx.fillRect(tx * W / gx, ty * H / gy, W / gx, H / gy); });
        const st = m.sharp.sharpestTile; ctx.strokeStyle = "#FFC845"; ctx.lineWidth = Math.max(2, W / 250); ctx.strokeRect(st.tx * W / gx + 2, st.ty * H / gy + 2, W / gx - 4, H / gy - 4);
      }
    }
    $("#ovSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; $("#ovSeg").querySelectorAll("button").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b)); }); draw(b.dataset.o); if (b.dataset.o !== "none") $("#v-result .frame").scrollIntoView({ behavior: "smooth", block: "center" }); });
  }

  let chatBusy = false;
  async function ask(q) {
    if (chatBusy) return; chatBusy = true;
    const p = state.before, msgs = $("#msgs");
    msgs.insertAdjacentHTML("beforeend", `<div class="m me"><div class="bubble">${esc(q)}</div></div><div class="m" id="typing">${avatar()}<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`);
    msgs.scrollTop = msgs.scrollHeight; $("#chatIn").value = "";
    const t0 = new Date();
    try {
      const r = await PCCoach.callAI(PCCoach.buildChatMessages({ photo: p, history: state.chat, question: q }), p ? [p.blob] : [], { onProgress: (txt) => { const t = $("#typing .bubble"); if (t && txt && txt !== "Thinking...") t.textContent = txt; } });
      state.chat.push({ role: "user", content: q }, { role: "assistant", content: (r.text || "").trim() });
      state.logs.push({ id: "C" + Date.now().toString(36), kind: "chat", date: t0.toISOString(), app: APP_VERSION, ai: { engine: r.engine, model: r.model, promptVersion: PCCoach.CHAT_PROMPT_VERSION, seconds: Math.round((Date.now() - t0) / 1000) }, question: q, answer: r.text, reviewer: { verdict: "", note: "" } });
    } catch (e) {
      const t = $("#typing"); if (t) t.remove();
      msgs.insertAdjacentHTML("beforeend", `<div class="m">${avatar()}<div class="bubble">${esc(PCCoach.aiErrorMessage(e).replace(/ — แสดงผลจากเครื่องวัดในเครื่อง(แทน)?/, ""))}</div></div>`);

  }

  /* ---------- WORKS (saved in this browser only) ---------- */
  function loadWorks() { try { return JSON.parse(localStorage.getItem("cb_works") || "[]"); } catch (e) { return []; } }
  function storeWorks(w) { try { localStorage.setItem("cb_works", JSON.stringify(w)); return true; } catch (e) { return false; } }
  async function saveWork(p) {
    const k = Math.min(1, 480 / Math.max(p.view.width, p.view.height));
    const c = canvasOf(Math.round(p.view.width * k), Math.round(p.view.height * k)); c.getContext("2d").putImageData(scaleImageData(p.view, c.width, c.height), 0, 0);
    const item = { id: "W" + Date.now().toString(36), date: new Date().toISOString(), thumb: c.toDataURL("image/jpeg", 0.72), reaction: p.reaction, genre: p.genre,
      goods: goods(p).slice(0, 4), fixes: fixes(p).slice(0, 3), first: firstAdvice(p), scores: Object.fromEntries(Object.entries(merged(p)).map(([d, s]) => [d, s.v])), ai: !!p.ai };
    const w = [item, ...loadWorks()].slice(0, 15);
    if (!storeWorks(w)) { toast("บันทึกในเบราว์เซอร์นี้ไม่ได้ (พื้นที่เต็มหรือถูกปิดไว้)", 4000); return; }
    toast("บันทึกไว้ในผลงานแล้ว (เก็บในเครื่องนี้เท่านั้น)");
  }
  function scaleImageData(img, w, h) { const s = canvasOf(img.width, img.height); s.getContext("2d").putImageData(img, 0, 0); const d = canvasOf(w, h), x = d.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(s, 0, 0, w, h); return x.getImageData(0, 0, w, h); }
  function renderWorks() {
    const v = $("#v-works"), w = loadWorks();
    v.innerHTML = `${topbar("ผลงานของฉัน", null)}<div class="page">${w.length ? `<div class="grid2">${w.map((x) => `<button class="wk" data-id="${x.id}"><img src="${x.thumb}" alt="ผลงาน">${RX.R[x.reaction] && RX.R[x.reaction].text ? `<span class="pill${PRAISE.includes(x.reaction) ? " praise" : ""}">${esc(RX.R[x.reaction].text)}</span>` : ""}<div class="meta"><b>${esc(PCCoach.GENRES[x.genre] || "ภาพ")}</b><span>${new Date(x.date).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" })}</span></div></button>`).join("")}</div>
      <p class="cap muted" style="margin-top:14px">ผลงานเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น (สูงสุด 15 รายการ) และอาจหายเมื่อล้างข้อมูลเบราว์เซอร์</p>`
      : `<div class="empty">${RX.sticker("rest", 170)}<h2 style="font-size:19px">ยังไม่มีผลงานที่บันทึก</h2><p class="muted">วิเคราะห์ภาพแล้วกด "บันทึก" ภาพจะมาอยู่ที่นี่</p><a class="btn btn-amber" href="#home">${I("image", 22)}ไปเลือกรูป</a></div>`}</div>`;

  }

  /* ---------- tester log ---------- */
  function addLog(p, kind, cmp) {
    const meta = kind === "analyze" ? p.aiMeta : cmp && cmp.aiMeta, out = kind === "analyze" ? p.ai : cmp && cmp.ai;
    const rec = { id: (kind === "analyze" ? "T" : "P") + Date.now().toString(36), kind, date: new Date().toISOString(), app: APP_VERSION, localEngine: PCEngine.ENGINE_VERSION,
      file: { name: p.name, type: p.type, bytes: p.bytes, w: p.origW, h: p.origH, hasExif: !!p.exif }, genreUsed: p.genre, reaction: p.reaction || null,
      localScores: p.local.scores, localFindings: p.local.findings.map((f) => `${f.kind}:${f.title}`),
      ai: meta ? { engine: meta.engine, model: meta.model, promptVersion: meta.promptVersion, seconds: meta.seconds, error: meta.error || null, output: out } : null, reviewer: { verdict: "", note: "" } };
    state.logs.push(rec); p.logId = rec.id;
  }
  function addBatchLog(b) {
    const rec = { id: "B" + Date.now().toString(36), kind: "batch", date: new Date().toISOString(), app: APP_VERSION, localEngine: PCEngine.ENGINE_VERSION, files: b.items.map((p) => ({ name: p.name, w: p.origW, h: p.origH, hasExif: !!p.exif, localScores: p.local.scores })),
      ai: b.aiMeta ? { engine: b.aiMeta.engine, model: b.aiMeta.model, promptVersion: b.aiMeta.promptVersion, seconds: b.aiMeta.seconds, weight: b.aiMeta.weight, error: b.aiMeta.error || null, output: b.ai } : null, reviewer: { verdict: "", note: "" } };
    state.logs.push(rec); b.logId = rec.id;
  }
  function logPanel(id, meta, pv) {
    const rec = state.logs.find((r) => r.id === id); if (!rec) return "";
    return `<div class="sec-title">สำหรับผู้ทดสอบ</div><dl class="kv small"><dt>รหัส</dt><dd>${esc(rec.id)}</dd><dt>เวลา</dt><dd>${esc(new Date(rec.date).toLocaleString("th-TH"))}</dd><dt>AI</dt><dd>${esc(meta ? meta.engine : "ไม่ได้ใช้")}</dd><dt>โมเดล</dt><dd>${esc((meta && meta.model) || "-")}</dd><dt>Prompt</dt><dd>${esc(pv)}</dd></dl>
      <div class="chips" data-verdict="${esc(id)}" style="margin-top:10px">${["ถูกต้อง", "ถูกบางส่วน", "ไม่ถูกต้อง"].map((x) => `<button class="chip ${rec.reviewer.verdict === x ? "on" : ""}" data-v="${x}">${x}</button>`).join("")}</div>
      <textarea class="field" data-note="${esc(id)}" rows="2" style="margin-top:8px;padding:10px 14px;min-height:64px" placeholder="ข้อสังเกตของผู้ตรวจ">${esc(rec.reviewer.note)}</textarea>
      <button class="btn btn-outline btn-sm" data-copy style="margin-top:8px">${I("copy", 18)}คัดลอกบันทึกทั้งหมด</button>`;
  }
  function bindLog(id) {
    const rec = state.logs.find((r) => r.id === id); if (!rec) return;
    const c = document.querySelector(`[data-verdict="${id}"]`), n = document.querySelector(`[data-note="${id}"]`);
    if (c) c.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; rec.reviewer.verdict = b.dataset.v; c.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); });
    if (n) n.addEventListener("input", (e) => { rec.reviewer.note = e.target.value; });
    document.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => copyText(JSON.stringify(state.logs, null, 1))));
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); toast("คัดลอกแล้ว"); }
    catch (e) { openSheet(`<h2>คัดลอกข้อความ</h2><p class="small muted">กดค้างในกล่องแล้วเลือกคัดลอก</p><textarea class="field" rows="10" readonly style="padding:10px;min-height:200px">${esc(t)}</textarea><button class="btn btn-dark btn-block" data-close style="margin-top:10px">ปิด</button>`); }
  }

  /* ---------- QUOTA ("พักแป๊บ~") ---------- */
  function renderQuota() {
    const v = $("#v-quota"), q = PCCoach.quota(), next = state.quotaNext;
    const mins = Math.max(1, Math.ceil((q.freeInSec || 0) / 60));
    const when = mins >= 60 ? `${Math.floor(mins / 60)} ชม. ${mins % 60} นาที` : `${mins} นาที`;
    const full = q.kind === "hour" || q.kind === "day";
    v.innerHTML = `<div class="quota">${RX.sticker("rest", 230)}
      <h2>พักแป๊บ~<span>แล้วมาถ่ายต่อ!</span></h2>
      ${full ? `<p class="muted">${q.kind === "day" ? `วันนี้ใช้ AI ครบ ${q.limits.perDay} ครั้งแล้ว` : `ชั่วโมงนี้ใช้ AI ครบ ${q.limits.perHour} ครั้งแล้ว`}<br>ใช้ AI ได้อีกครั้งในอีกประมาณ</p><div class="big">${when}</div>`
        : `<p class="muted">ตอนนี้ใช้ AI ได้ตามปกติ</p>`}
      <div class="infobox">${I("camera", 30)}<span>ระหว่างนี้ยังใช้การวัดพื้นฐานได้<br><span class="muted small">แสง / ความคม / สี / EXIF</span></span></div>
      ${next ? `<a class="btn btn-amber btn-lg" href="#${next}" id="qNext">ดูผลการวัดพื้นฐาน</a>` : ""}
      <a class="btn ${next ? "btn-ghost" : "btn-amber btn-lg"}" href="#home">กลับหน้าแรก</a></div>`;
  }

  function emptyPage(title, h, sub, back) {
    return `${topbar(title, back || "home")}<div class="page no-tab"><div class="empty">${RX.sticker("rest", 170)}<h2 style="font-size:19px">${esc(h)}</h2>${sub ? `<p class="muted">${esc(sub)}</p>` : ""}<a class="btn btn-amber" href="#home">${I("image", 22)}ไปเลือกรูป</a></div></div>`;
  }

  /* ---------- routing ---------- */
  const VIEWS = { home: renderHome, works: renderWorks, work: renderWork, tips: renderTips, profile: renderProfile, result: renderResult, batch: renderBatch, adjust: renderAdjust, compare: renderCompare, chat: renderChat, quota: renderQuota };
  const TABBED = ["home", "works", "tips", "profile"];
  function go(name) { if (location.hash !== "#" + name) location.hash = name; else show(name); }
  function show(name) {
    if (!VIEWS[name]) name = "home";
    Object.keys(VIEWS).forEach((x) => $("#v-" + x).classList.toggle("on", x === name));
    VIEWS[name]();
    $("#v-" + name).classList.add("on");
    $("#tabbar").classList.toggle("hide", !TABBED.includes(name));
    document.querySelectorAll("#tabbar a").forEach((a) => a.classList.toggle("on", a.dataset.v === name));
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));

  /* ---------- inputs ---------- */
  const pick = (list) => { const fs = Array.from(list || []); if (!fs.length) return; if (fs.length > MAX_BATCH) toast(`เลือกได้สูงสุด ${MAX_BATCH} รูป จะใช้ ${MAX_BATCH} รูปแรก`, 3500); fs.length === 1 ? runMain(fs[0]) : runBatch(fs); };
  const bindInput = (id, fn) => $(id).addEventListener("change", (e) => { const fl = Array.from(e.target.files); e.target.value = ""; if (fl.length) fn(fl); });
  bindInput("#inLibrary", pick);
  bindInput("#inAfterLib", (f) => runAfter(f[0]));
  bindInput("#inChat", (f) => runMain(f[0]));
  document.querySelectorAll("[data-ic]").forEach((el) => (el.innerHTML = I(el.dataset.ic, 24)));

  /* ---------- boot ---------- */
  show(location.hash.slice(1) || "home");
  PCCoach.initAI().then(() => { const n = location.hash.slice(1) || "home"; renderHome(); if (["profile", "chat"].includes(n)) show(n); });
  window.PCApp = { state, runMain, runAfter, runBatch, prepare };
})();
</script>
</body>
</html>
