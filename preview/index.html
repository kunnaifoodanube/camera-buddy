:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --border:#DAE2DE; --line:#E7ECE9;
  --ink:#273B38; --muted:#5E6E69;
  --sage:#789889; --sage-ink:#4E7264; --sage-deep:#3F5F52; --sage-light:#E5EFE8;
  --sky:#D9EBF3; --sky-light:#EAF4F8; --sky-ink:#2F5D73;
  --sun:#F5DDA1; --sun-light:#FBF1D6; --sun-ink:#7A5A12;
  --danger:#B6544A; --danger-light:#F8E9E6;
  /* legacy names kept for icons.js (stars, check, paw) */
  --cb-amber:#EFC468; --cb-green:#4E7264; --cb-cream:#FFFFFF; --cb-charcoal:#273B38;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px;
  --r-sm:12px; --r-md:16px; --r-lg:20px; --r-pill:999px; --r-btn:14px;
  --shadow:0 1px 2px rgba(39,59,56,.05),0 6px 18px rgba(39,59,56,.07);
  --shadow-lg:0 10px 30px rgba(39,59,56,.12);
  --font-display:"Noto Sans Thai",system-ui,sans-serif;
  --font-body:"Noto Sans Thai",system-ui,sans-serif;
  --tabbar-h:68px;
  --chip-bg:var(--sage-light); --chip-fg:var(--ink); --chip-on-bg:var(--sage-ink); --chip-on-fg:#fff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#EEF1EC;font-family:var(--font-body);font-size:16px;line-height:1.6;color:var(--ink);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky-ink);outline-offset:2px}
.app{position:relative;max-width:480px;min-height:100dvh;margin:0 auto;background:var(--bg);color:var(--ink);overflow-x:hidden}
.view{display:none;min-height:100dvh}
.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.ic{display:block;flex:none}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:15px;line-height:1.55}
.cap{font-size:14px;line-height:1.5}

/* buttons — min 48px touch targets */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:var(--r-btn);min-height:48px;padding:0 20px;font-family:var(--font-display);font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .08s,background .15s;text-align:center;line-height:1.3}
.btn:active{transform:scale(.98)}
.btn-lg{min-height:56px;font-size:18px}
.btn-block{width:100%}
.btn-sm{min-height:48px;font-size:15.5px;padding:0 16px}
.btn-amber{background:var(--sage-ink);color:#fff;box-shadow:0 4px 12px rgba(78,114,100,.25)}
.btn-amber:hover{background:var(--sage-deep)}
.btn-cream{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--border)}
.btn-dark{background:var(--ink);color:#fff}
.btn-outline{background:transparent;color:var(--sage-ink);box-shadow:inset 0 0 0 1.5px var(--sage-ink)}
.btn-ghost{background:var(--sage-light);color:var(--ink)}
.btn-danger{background:var(--surface);color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn:disabled{opacity:.45}
.iconbtn{width:48px;height:48px;border:0;border-radius:var(--r-pill);background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;text-decoration:none}
.link{background:none;border:0;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:60px;padding:6px 6px;background:rgba(250,249,245,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);border-bottom:1px solid var(--line)}
.topbar h1{font-size:19px;font-weight:700;text-align:center;line-height:1.25}
.topbar .who{display:flex;align-items:center;gap:10px;justify-self:start}
.topbar .who b{display:block;font-weight:700;font-size:17px;line-height:1.2}
.topbar .who span{font-size:13px;color:var(--muted)}
.page{padding:var(--sp-4) var(--sp-4) calc(var(--tabbar-h) + var(--sp-8))}
.page.no-tab{padding-bottom:var(--sp-10)}

/* Buddy pose images (v2 cutouts) */
.pose{display:block;height:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(39,59,56,.16));pointer-events:none;user-select:none}
.glow{position:relative;display:grid;place-items:end center;isolation:isolate}
.glow::before{content:"";position:absolute;z-index:-1;left:50%;bottom:4%;width:92%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(245,221,161,.85),rgba(245,221,161,.35) 45%,rgba(217,235,243,0) 70%)}

.pane{position:relative;display:flex;align-items:flex-end;width:100%;max-width:340px;margin:0 auto;padding-top:14px;overflow:hidden;border-radius:var(--r-lg);background:linear-gradient(180deg,var(--sky-light) 0%,var(--sun-light) 100%);border:1px solid var(--line)}
.pane-l{justify-content:flex-start}.pane-r{justify-content:flex-end}
.pane .pose{max-width:78%;filter:drop-shadow(0 4px 8px rgba(39,59,56,.12))}
#busySticker{width:100%}
.busy-card .pane{max-width:320px}
.busy-card .pane .pose{width:230px}
.quota .pane .pose{width:min(78%,280px)}
.empty .pane{max-width:300px}
.empty .pane .pose{width:min(70%,210px)}
/* splash (first launch only) */
.splash{position:fixed;inset:0;z-index:95;background:linear-gradient(180deg,#E3F0F6 0%,#F3F6EF 42%,var(--bg) 70%);display:flex;justify-content:center;overflow:auto}
.sp-in{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(36px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.sp-logo{width:64px;height:64px;border-radius:20px;background:var(--surface);display:grid;place-items:center;color:var(--sage-ink);box-shadow:var(--shadow)}
.sp-brand{margin-top:14px;font-size:clamp(30px,10.5vw,40px);white-space:nowrap;font-weight:700;letter-spacing:-.5px;line-height:1.05}
.sp-brand span{color:var(--sage-ink)}
.sp-sun{display:block;width:120px;height:6px;margin:10px auto 0;border-radius:99px;background:var(--sun)}
.sp-tag{margin-top:12px;font-size:18px;color:var(--muted)}
.sp-cat{flex:1 0 auto;width:100%;display:flex;align-items:flex-end;justify-content:center;margin-top:8px}
.sp-cat .pose{width:min(66vw,260px);height:auto;max-height:36dvh;object-fit:contain;object-position:bottom}
.sp-say{position:relative;margin:4px 0 18px;background:var(--surface);border-radius:var(--r-lg);padding:12px 18px;box-shadow:var(--shadow);font-size:17px;font-weight:600;line-height:1.45}
.sp-in .btn{max-width:360px}

/* home */
.home2{padding:calc(6px + env(safe-area-inset-top)) var(--sp-4) calc(var(--tabbar-h) + 24px)}
.h-top{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.h-brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--sage-deep)}
.h-brand .ic{color:var(--sage-ink)}
.h-hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px;margin-top:4px}
.h-hi h1{font-size:28px;line-height:1.25}
.h-hi p{margin-top:6px;color:var(--muted);font-size:16px}
.h-cat{width:clamp(118px,36vw,160px)}
.h-cat .pose{width:100%}
.h-ask{position:relative;margin:4px 0 16px;background:var(--sun-light);border-radius:var(--r-lg);padding:14px 16px;font-weight:600;font-size:17px;line-height:1.45;text-align:center}
.h-ask::before{content:"";position:absolute;top:-8px;right:56px;border:8px solid transparent;border-top:0;border-bottom-color:var(--sun-light)}
.home-note{text-align:center;font-size:14px;color:var(--muted);margin-top:8px}
.h-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.h-tile{display:grid;align-content:start;justify-items:start;gap:4px;min-height:116px;padding:16px 14px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);text-align:left;text-decoration:none;cursor:pointer;box-shadow:var(--shadow);font:inherit}
.h-tile .t-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sage-light);color:var(--sage-ink);margin-bottom:4px}
.h-tile:nth-child(2) .t-ic{background:var(--sky);color:var(--sky-ink)}
.h-tile:nth-child(3) .t-ic{background:var(--sun-light);color:var(--sun-ink)}
.h-tile:nth-child(4) .t-ic{background:var(--sky-light);color:var(--sky-ink)}
.h-tile b{font-weight:700;font-size:16.5px;line-height:1.3}
.h-tile span{font-size:13.5px;color:var(--muted);line-height:1.4}
.h-status{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:14px;color:var(--muted)}
.h-status i{width:8px;height:8px;border-radius:50%;background:var(--sage-ink);display:inline-block}
.login-card{margin-top:18px;background:var(--sky-light);border:1px solid var(--sky);border-radius:var(--r-lg);padding:16px;display:grid;gap:10px}
.login-card b{font-weight:700;font-size:17px;color:var(--sky-ink)}
.login-card p{margin:0;font-size:15px;line-height:1.55}
.login-card .fine{font-size:13.5px;color:var(--muted)}
.draft-tag{display:inline-block;font-size:12px;font-weight:600;background:var(--sun-light);color:var(--sun-ink);border-radius:var(--r-pill);padding:2px 10px}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted);text-decoration:none}
.tabbar a span{display:grid;place-items:center;width:52px;height:30px;border-radius:var(--r-pill)}
.tabbar a.on{color:var(--sage-deep);font-weight:700}
.tabbar a.on span{background:var(--sage-light);color:var(--sage-ink)}
.tabbar.hide{display:none}

/* photo frame + reaction sticker + overlay tools */
.frame-wrap{position:relative;padding:var(--sp-3) var(--sp-4) 0}
.frame{position:relative;border-radius:var(--r-lg);overflow:hidden;border:5px solid var(--surface);background:#EEF1EE;box-shadow:var(--shadow)}
.frame img{display:block;width:100%;height:auto;max-height:56dvh;object-fit:contain;background:#EEF1EE}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.badge-react{position:absolute;top:0;right:12px;transform:rotate(-4deg);background:var(--sun);color:var(--ink);font-weight:700;font-size:18px;padding:4px 14px;border-radius:var(--r-pill);box-shadow:var(--shadow);border:2px solid var(--surface);z-index:3}
.badge-react.praise{background:var(--sage-light)}
.badge-react.low{top:auto;bottom:58px}
.react-stk{position:absolute;top:-14px;right:2px;z-index:3;transform:rotate(5deg);filter:drop-shadow(0 4px 8px rgba(39,59,56,.25));pointer-events:none}
.react-stk.low{top:auto;bottom:44px}
.ovbar{padding:10px var(--sp-4) 0}
.ovseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ovseg .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;min-height:58px;font-size:13.5px;line-height:1.2;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.ovseg .chip.on{background:var(--sage-ink);color:#fff;box-shadow:none}
.ovbar .cap{margin-top:6px;color:var(--muted)}

/* Buddy speech */
.say,.bsay{display:flex;align-items:flex-end;gap:10px;padding:var(--sp-4) var(--sp-4) 0}
.bsay{padding:0;margin-top:var(--sp-4)}
.bsay .pose{width:84px;flex:none}
.bsay .bubble{margin-bottom:10px}
.say>.avatar{width:56px;height:56px}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--surface);background:var(--sage-light);box-shadow:0 1px 3px rgba(39,59,56,.15)}
.avatar.lg{width:84px;height:84px;border-width:3px}
.bubble{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 20px 6px;padding:10px 14px;max-width:100%;box-shadow:0 1px 2px rgba(39,59,56,.05)}
.bubble b{font-weight:700;font-size:17px;line-height:1.4;display:block}
.bubble p{font-size:15.5px;line-height:1.55}
.bubble b+p{margin-top:2px;color:var(--muted)}
.say .stk{margin-top:8px}
.say-stack{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.sticker{display:block}

/* the 3 most urgent fixes — always shown before any other detail */
.sect{padding:0 var(--sp-4)}
.fix3{margin-top:var(--sp-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 14px 6px;box-shadow:var(--shadow)}
.fix3 h2{font-size:19px;display:flex;align-items:center;gap:8px;padding:0 2px}
.fix3 h2 .ic{color:var(--sage-ink)}
.fix3 ol{list-style:none;margin:10px 0 0;padding:0}
.fx{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
.fx:first-child{border-top:0;padding-top:6px}
.fx-n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--ink);font-weight:700;font-size:18px}
.fx:first-child .fx-n{background:var(--sage-ink);color:#fff}
.fx-dim{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--sage-ink);background:var(--sage-light);border-radius:var(--r-pill);padding:1px 10px 1px 6px}
.fx-dim.gen{color:var(--sky-ink);background:var(--sky-light)}
.fx b{display:block;margin-top:4px;font-weight:700;font-size:17px;line-height:1.4}
.fx p{margin-top:2px;font-size:15.5px;line-height:1.55;color:var(--ink)}
.fix-src{margin:2px 2px 10px;font-size:13.5px;color:var(--muted)}
.res-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--sp-4)}
.res-actions .btn{padding:0 10px}
.res-actions .full{grid-column:1/-1}
.more-h{display:flex;align-items:center;gap:10px;margin:28px var(--sp-4) 0;font-size:15px;font-weight:700;color:var(--muted)}
.more-h::after{content:"";flex:1;height:1px;background:var(--border)}

/* white cards */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin:var(--sp-4) var(--sp-4) 0;padding:var(--sp-4);box-shadow:var(--shadow)}
.panel:last-child{margin-bottom:var(--sp-8)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-4);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-bottom:10px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.checks li .ic-check{margin-top:2px;flex:none}
.tip{background:var(--sun-light);border-radius:var(--r-md);padding:14px 16px;margin-top:var(--sp-4)}
.tip h3{display:flex;align-items:center;gap:8px;font-size:17px;margin-bottom:6px}
.tip ul{margin:0;padding-left:20px}
.tip li{margin:4px 0;font-size:16px}
.tip.lav{background:var(--sky-light)}
.tip.lav h3{color:var(--sky-ink)}
.row{display:flex;gap:10px}
.row>.btn{flex:1}
.sec-title{font-weight:700;font-size:17px;margin:var(--sp-6) 0 var(--sp-3)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--sun-light);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;font-size:15px;margin-bottom:var(--sp-3)}
.note .ic{color:var(--sun-ink);margin-top:2px}
.sect .note{margin:var(--sp-3) 0 0}

/* details */
details.more{margin-top:var(--sp-3)}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:48px;font-weight:600;font-size:16px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary .ic{transition:transform .2s;color:var(--muted)}
details.more[open]>summary .ic{transform:rotate(90deg)}
.scores{display:grid;gap:12px;margin-top:4px}
.score{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:15.5px}
.stars{display:inline-flex;gap:2px;color:var(--muted);vertical-align:middle}
.stars svg{display:block}
.star-h small,.star-tag{font-family:var(--font-body);font-weight:500;font-size:13.5px;color:var(--muted)}
.star-note{margin-top:12px;font-size:14px;line-height:1.55;background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;color:var(--ink)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--sage-ink)}
.score .na{grid-column:2/3;font-size:14px;color:var(--muted)}
.score-note{grid-column:1/-1;font-size:14px;color:var(--muted);margin-top:-6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:var(--r-pill);background:var(--chip-bg);color:var(--chip-fg);padding:0 16px;font-size:15px;font-weight:500;cursor:pointer;min-height:44px}
.chip.on{background:var(--chip-on-bg);color:var(--chip-on-fg);font-weight:600}
.find{padding:10px 0;border-bottom:1px solid var(--line)}
.find:last-child{border:0}
.find .t{font-weight:600}
.find .small{margin-top:2px}
.conf{font-size:13px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--sage-light);white-space:nowrap}
.hist{width:100%;height:56px;display:block}

/* adjust */
.first{background:var(--sun-light);color:var(--ink);border-radius:var(--r-lg);padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid #F0E2BD}
.first .lab{font-size:14px;font-weight:600;color:var(--sun-ink)}
.first h2{font-size:19px;margin-top:2px}
.first p{font-size:15px;margin-top:6px}
.setup{display:grid;gap:2px}
.setup .it{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.setup .it:last-child{border:0}
.setup .ib{width:44px;height:44px;border-radius:12px;background:var(--sage-light);display:grid;place-items:center;color:var(--sage-ink)}
.setup .k{font-size:14px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.steps li:last-child{border:0}
.steps input{width:24px;height:24px;margin-top:2px;accent-color:var(--sage-ink);flex:none}
.bul{margin:0;padding-left:20px} .bul li{margin:6px 0}

/* compare */
.cmp{position:relative;border-radius:var(--r-lg);overflow:hidden;border:5px solid var(--surface);background:#EEF1EE;touch-action:pan-y;box-shadow:var(--shadow)}
.cmp img{display:block;width:100%;height:auto}
.cmp .after{position:absolute;inset:0;overflow:hidden}
.cmp .after img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lbl{position:absolute;top:10px;font-weight:700;font-size:15px;border-radius:var(--r-pill);padding:2px 12px;z-index:2;box-shadow:0 2px 6px rgba(39,59,56,.2)}
.lbl.b{background:var(--sun);color:var(--ink)} .lbl.a{background:var(--surface);color:var(--ink)}
.cmp .handle{position:absolute;top:0;bottom:0;width:3px;background:var(--surface);box-shadow:0 0 0 1px rgba(39,59,56,.25);pointer-events:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .pi{position:relative}
.pair img{width:100%;border-radius:var(--r-md);display:block;border:4px solid var(--surface);box-shadow:var(--shadow)}
.pair .lbl{left:10px}
input[type=range]{width:100%;height:32px;accent-color:var(--sage-ink)}
table.delta{width:100%;border-collapse:collapse;font-size:15px}
table.delta td,table.delta th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
table.delta th{color:var(--muted);font-size:14px}
table.delta .n{text-align:center;white-space:nowrap}
.up{color:var(--sage-ink);font-weight:700} .down{color:var(--danger);font-weight:700}

/* chat */
.chat{flex-direction:column;height:100dvh;background:var(--bg)}
.view.chat.on{display:flex}
.chat .topbar{position:relative}
.msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .bubble{white-space:pre-wrap}
.m.me .bubble{background:var(--sage-light);border-color:#CFE0D5;border-radius:20px 20px 6px 20px}
.m.me .photo-msg{border-radius:18px;border:4px solid var(--surface);max-width:240px;display:block;box-shadow:var(--shadow)}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 8px;scrollbar-width:none}
.suggest .chip{flex:none;background:var(--surface);color:var(--sage-deep);box-shadow:inset 0 0 0 1.5px var(--sage)}
.composer{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border)}
.composer input{min-width:0;width:100%;min-height:48px;border:0;border-radius:var(--r-pill);background:var(--bg);padding:0 16px;box-shadow:inset 0 0 0 1px var(--border);outline:none}
.composer input:focus{box-shadow:inset 0 0 0 2px var(--sage)}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--sage-ink);color:#fff;display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.45}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* works / batch grids */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wk{position:relative;border:1px solid var(--border);padding:0;background:var(--surface);border-radius:var(--r-md);overflow:hidden;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.wk img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.wk .meta{padding:8px 10px 10px}
.wk .meta b{font-weight:600;font-size:15.5px;display:block;line-height:1.3}
.wk .meta span{font-size:13.5px;color:var(--muted)}
.wk .pill{position:absolute;top:8px;left:8px;background:var(--sun);color:var(--ink);font-weight:600;font-size:13px;border-radius:var(--r-pill);padding:1px 10px}
.wk .pill.praise{background:var(--sage-light)}
.th{position:relative;border:1px solid var(--border);padding:4px;background:var(--surface);border-radius:var(--r-md);cursor:pointer;box-shadow:var(--shadow);min-height:48px}
.th img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.th .sc{display:flex;align-items:center;justify-content:center;padding:5px 0 1px;color:var(--muted)}
.th .n{position:absolute;top:8px;left:8px;background:rgba(39,59,56,.78);color:#fff;font-size:12.5px;border-radius:var(--r-pill);padding:0 8px}
.empty{text-align:center;padding:28px 16px;display:grid;justify-items:center;gap:12px}
.empty .pose{width:min(60vw,220px)}
.empty .glow .pose{width:min(46vw,180px)}
.empty h2{font-size:19px}

/* tips */
.tiplist{display:grid;gap:10px}
.tipcard{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow)}
.tipcard .ib{width:48px;height:48px;border-radius:14px;background:var(--sage-light);color:var(--sage-ink);display:grid;place-items:center}
section[data-dim="lighting"] .tipcard .ib,.tipcard[data-cdim="lighting"] .ib{background:var(--sun-light);color:var(--sun-ink)}
section[data-dim="color"] .tipcard .ib,.tipcard[data-cdim="color"] .ib,section[data-dim="story"] .tipcard .ib,.tipcard[data-cdim="story"] .ib{background:var(--sky-light);color:var(--sky-ink)}
.tipcard summary{list-style:none;cursor:pointer;min-height:48px}
.tipcard summary::-webkit-details-marker{display:none}
.tipcard summary b{font-weight:700;font-size:16.5px;display:block;line-height:1.35}
.tipcard .try{background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;margin-top:8px;font-size:15.5px}
.tipcard .try b{color:var(--sage-ink)}
.filter{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:4px -16px 4px;padding:0 16px}
.filter .chip{flex:none}
.tips-hero{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:10px;margin:0 0 12px}
.tips-hero .pose{width:92px}
.tips-hero .bubble{margin-bottom:12px}

/* profile */
.prof{display:flex;align-items:center;gap:14px;padding:6px 2px 4px}
.prof .av-wrap{position:relative}
.prof h2{font-size:23px}
.prof .dot{position:absolute;right:2px;bottom:4px;width:20px;height:20px;border-radius:50%;border:3px solid var(--bg);background:var(--sage-ink)}
.prof .dot.off{background:#A9B4B0}
.status{display:inline-block;font-size:13.5px;font-weight:600;border-radius:var(--r-pill);padding:1px 12px;background:var(--sage-light);color:var(--sage-deep);margin-top:4px}
.status.off{background:var(--line);color:var(--muted)}
.set{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:4px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.set .li{padding:14px 0;border-bottom:1px solid var(--line)}
.set .li:last-child{border:0}
.set .lh{font-weight:600;font-size:16.5px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;min-height:48px;font-weight:600;font-size:16.5px}
.switch input{appearance:none;width:52px;height:30px;border-radius:99px;background:#C9D3CF;position:relative;flex:none;cursor:pointer;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch input:checked{background:var(--sage-ink)}
.switch input:checked::after{left:25px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-top:8px;font-size:15.5px}
.qrow .bar{grid-column:1/-1;height:10px}
.qrow .bar i{background:var(--sage-ink)} .qrow .bar i.mid{background:#D9A93A} .qrow .bar i.full{background:var(--danger)}
.qrow b{font-weight:700}
.privacy{display:flex;gap:12px;align-items:flex-start}
.privacy .ib{width:40px;height:40px;border-radius:50%;background:var(--sage-light);color:var(--sage-ink);display:grid;place-items:center;flex:none}
.privacy a{color:var(--sage-ink)}
.field{width:100%;min-height:48px;border:0;border-radius:var(--r-sm);background:var(--surface);padding:0 14px;box-shadow:inset 0 0 0 1px var(--border)}

/* analysing screen (full screen, light) */
.busy{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#E8F2F6 0%,var(--bg) 55%);display:none;align-items:center;justify-content:center;padding:24px}
.busy.on{display:flex}
.busy-card{color:var(--ink);width:100%;max-width:360px;display:grid;justify-items:center;gap:10px;text-align:center}

.busy-card b{font-size:26px;font-weight:700;line-height:1.25;margin-top:4px}
.busy-sub{font-size:16px;color:var(--muted);min-height:26px}
.pbar{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:6px}
.pbar .bar{height:12px;background:var(--line)}
.pbar .bar i{transition:width .4s ease}
.pbar span{font-size:15px;font-weight:600;color:var(--sage-ink);min-width:36px;text-align:right}
.busy-note{font-size:14px;color:var(--muted);min-height:20px}
.busy .btn{margin-top:12px;min-width:220px}
.prog{display:none}

/* quota screen */
.quota{min-height:100dvh;display:grid;align-content:center;justify-items:center;gap:12px;text-align:center;padding:32px 24px 40px}

.quota h2{font-size:34px;line-height:1.15;margin-top:4px}
.quota h2 span{display:block;color:var(--sage-ink);font-size:26px}
.quota .big{font-weight:700;font-size:32px;line-height:1.1}
.quota .infobox{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-top:6px;width:100%}
.quota .infobox .ic{color:var(--sage-ink)}
.quota .btn{width:100%}

/* sheet, toast, demos */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(39,59,56,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-panel{background:var(--bg);width:100%;max-width:480px;max-height:86dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.sheet-panel h2{font-size:20px;margin-bottom:12px}
/* toast sits below the top bar so it never covers back/action buttons or the tab bar */
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-md);font-size:15px;z-index:99;display:none;width:max-content;max-width:min(92vw,440px);text-align:center;box-shadow:var(--shadow-lg);pointer-events:none}
.toast.on{display:block;animation:fade .2s ease}
.demo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.demo button{border:1px solid var(--border);padding:0;border-radius:var(--r-md);overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.demo img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.demo span{display:block;padding:6px 8px;font-size:14px}
@media (prefers-reduced-motion:reduce){.view.on,.toast.on{animation:none}.pbar .bar i{transition:none}}

/* faculty promo card */
.promo{display:grid;gap:4px;margin-top:var(--sp-6);padding:16px 18px;border-radius:var(--r-lg);background:var(--sky-light);border:1px solid var(--sky);color:var(--ink);text-decoration:none}
.promo .pl{justify-self:start;font-size:13px;font-weight:600;color:var(--sky-ink);background:var(--surface);border-radius:var(--r-pill);padding:1px 10px}
.promo b{font-weight:700;font-size:17px;margin-top:4px}
.promo .pt{font-size:15px;color:var(--muted)}
.promo .pc{display:inline-flex;align-items:center;gap:2px;color:var(--sky-ink);font-weight:600;font-size:16px;margin-top:4px;min-height:32px}

/* bento detail blocks (owner 2026-11-19: short readable blocks) */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px var(--sp-4) 8px}
.bento .span2{grid-column:1/-1}
.bx{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;min-width:0;cursor:default}
.bx.amber{background:var(--sun-light);border-color:#F0E2BD} .bx.green{background:var(--sage-light);border-color:#D3E3D8} .bx.pink,.bx.lav{background:var(--sky-light);border-color:#D2E6EE}
.bx-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:15.5px;line-height:1.25}
.bx-h b{font-weight:700}
.bx-ic{flex:none;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.75);color:var(--sage-ink)}
.bx-t{margin:0;font-size:15px;line-height:1.5}
.bx .clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bx.open .clamp{display:block;-webkit-line-clamp:unset}
.bx-ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px;line-height:1.45;counter-reset:n}
.bx-ul li{position:relative;padding-left:16px}
.bx-ul li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45}
.bx-ul.num li{padding-left:24px;counter-increment:n}
.bx-ul.num li::before{content:counter(n);width:auto;height:auto;top:0;left:0;background:none;opacity:1;font-weight:700}
.mstars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ms{display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:2px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 10px}
.ms-ic{grid-row:1/3;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--sage-light);color:var(--sage-ink)}
.ms-n{font-size:14.5px;line-height:1.2}
.ms .na{font-size:13px;color:var(--muted)}
.bx .more{margin-top:10px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 2px 8px;-webkit-overflow-scrolling:touch}
.pcard{flex:0 0 64%;scroll-snap-align:start;display:grid;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:18px;padding:0;overflow:hidden;text-align:left;font:inherit;cursor:pointer;box-shadow:var(--shadow)}
.pcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.pc-b{display:grid;gap:4px;padding:10px 12px 12px;font-size:15px;line-height:1.45}
.pc-b b{font-weight:700;font-size:15.5px}
.pc-b .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.batch-cap{margin-top:8px}

/* very narrow phones (≤340px) */
@media (max-width:340px){
  .h-hi h1{font-size:24px}
  .h-tile{min-height:108px;padding:14px 12px}
  .h-tile b{font-size:15.5px}
  .ovseg .chip{font-size:12.5px}
  .res-actions{grid-template-columns:1fr}
  .bsay .pose{width:70px}
  .topbar h1{font-size:17.5px}
}
</style>
</head>

      if (slowShutter) push({ dim: "focus", kind: "note", title: "ชัตเตอร์ค่อนข้างช้า", evidence: `${fmtShutter(slow)} (ค่าที่ปลอดภัยโดยประมาณสำหรับถือมือคือเร็วกว่า 1/${Math.round(1 / safe)})`, cause: "ภาพนี้ยังดูคม แต่ครั้งหน้าระวังภาพสั่น", confidence: "สูง", fix: "", edit: "", principles: ["shutter_speed"] });
    }
    const unevenSharp = Fs > 3 && s.medianIndex < s.index * 0.45;
    scores.focus = noisy && Fs > 3 ? (slowShutter ? 3 : null) : unevenSharp ? null : Fs; // can't confirm the SUBJECT is the sharp part

    // ---- colour
    let C = 4;
    if (c.grayscale) push({ dim: "color", kind: "note", title: "ภาพขาวดำ", evidence: "ไม่พบสีในภาพ", cause: "", confidence: "สูง", fix: "", edit: "", principles: [] });
    else {
      if (c.oversaturatedPct > 40) { C = 3; push({ dim: "color", kind: "issue", title: "สีจัดจนอาจดูไม่เป็นธรรมชาติ", evidence: `พิกเซลที่สีอิ่มเกือบเต็มที่มี ${c.oversaturatedPct}% ของภาพ`, cause: "ฟิลเตอร์หรือการเร่งสีมากเกินไป หรือแสงสีจัดในสถานที่", confidence: "ปานกลาง", fix: "ปิดฟิลเตอร์สีจัดในกล้อง", edit: "ลด Saturation หรือใช้ Vibrance แทน", principles: ["color_mood"] }); }
      else if (c.oversaturatedPct > 20) push({ dim: "color", kind: "note", title: "สีสดจัด", evidence: `${c.oversaturatedPct}% ของภาพมีสีอิ่มมาก`, cause: "อาจมาจากวัตถุสีสดในภาพ", confidence: "ปานกลาง", fix: "", edit: "", principles: [] });
      if (c.castReliable && Math.abs(c.castWarmth) > 0.3) {
        C = Math.min(C, 3);
        const warm = c.castWarmth > 0;
        push({ dim: "color", kind: "issue", title: warm ? "ภาพติดโทนส้ม/เหลือง" : "ภาพติดโทนฟ้า",
          evidence: `ส่วนที่ควรเป็นสีขาว/เทา (${c.neutralPct}% ของภาพ) มีสี${warm ? "อุ่น" : "เย็น"}ปน`,
          cause: warm ? "ไฟหลอดสีส้มหรือแสงเย็นยามเย็น" : "ร่มเงาหรือแสงจากหน้าต่างช่วงฟ้าครึ้ม", confidence: "ปานกลาง",
          fix: "ถ้าไม่ได้ตั้งใจ ให้ตั้ง White Balance (สมดุลแสงขาว) ให้ตรงกับแหล่งแสง", edit: "ปรับ Temperature/White Balance", principles: ["white_balance", "intent_vs_error"] });
      }
      if (c.saturation < 0.08) { C = Math.min(C, 3); push({ dim: "color", kind: "note", title: "สีค่อนข้างซีด", evidence: `ความอิ่มสีเฉลี่ย ${c.saturation}`, cause: "แสงทึบ หมอก หรือย้อนแสง", confidence: "ปานกลาง", fix: "", edit: "เพิ่ม Vibrance เล็กน้อย", principles: ["color_mood"] }); }
    }
    scores.color = C;

    // ---- technical
    let T = 5;
    const sig = Math.max(m.noise.viewSigma, (m.detail && m.detail.noiseSigma) || 0);
    if (sig > 8) T = 1; else if (sig > 5) T = 2; else if (sig > 3) T = 3; else if (sig > 1.8) T = 4;
    if (T <= 3) {
      const isoTxt = ex && ex.iso ? ` ข้อมูลกล้องระบุ ISO ${ex.iso}` : "";
      push({ dim: "technical", kind: "issue", title: "มีเม็ดนอยส์ (จุดสีหยาบ) ชัดเจน",
        evidence: `ระดับนอยส์ที่วัดได้ ${+sig.toFixed(1)} (ภาพสะอาดมักต่ำกว่า 1.8)` + isoTxt,
        cause: ex && ex.iso >= 1600 ? "ISO (ความไวแสง) สูงเพราะแสงน้อย" : "แสงน้อยทำให้กล้องเร่งความไวแสง หรือภาพถูกเร่งความสว่างภายหลัง", confidence: ex && ex.iso ? "สูง" : "ปานกลาง",
        fix: "เพิ่มแสงในฉาก หรือวางกล้องให้นิ่งเพื่อให้กล้องใช้ ISO ต่ำลงได้", edit: "ใช้ Noise Reduction ระดับกลาง (มากไปผิวจะเนียนเหมือนพลาสติก)", principles: ["iso_noise"] });
    }
    const long = Math.max(meta.origW || 0, meta.origH || 0);
    if (long && long < 1200) { T = Math.min(T, 4); push({ dim: "technical", kind: "note", title: "ความละเอียดภาพต่ำ", evidence: `${meta.origW}×${meta.origH} พิกเซล`, cause: "ภาพอาจถูกย่อหรือส่งต่อผ่านแอปแชต", confidence: "สูง", fix: "ส่งไฟล์ต้นฉบับจากกล้องเพื่อการวิเคราะห์ที่แม่นขึ้น", edit: "", principles: [] }); }
    if (T >= 4 && sig <= 1.8) push({ dim: "technical", kind: "good", title: "ภาพสะอาด นอยส์น้อย", evidence: `ระดับนอยส์ ${+sig.toFixed(1)}`, principles: [] });
    scores.technical = T;

    // composition & story need semantic understanding → not scored locally
    scores.composition = null;
    scores.story = null;
    return { findings: F, scores };
  }

  function compactMetrics(m, ex) {

      noiseSigma: Math.max(m.noise.viewSigma, (m.detail && m.detail.noiseSigma) || 0),

    };

  const PRINCIPLE_KEYS = ["rule_of_thirds", "leading_lines", "negative_space", "balance", "simplify_background", "framing", "light_direction", "backlight_hdr", "exposure_comp", "shutter_speed", "focus_lock", "iso_noise", "white_balance", "color_mood", "storytelling", "intent_vs_error", "eye_level", "golden_hour"];

ดูภาพที่แนบมา แล้ววิเคราะห์ 6 ด้าน: composition (องค์ประกอบ), lighting (แสงและการเปิดรับแสง), focus (โฟกัส/ความคม/ภาพสั่น), color (สี White Balance คอนทราสต์ อารมณ์), story (การเล่าเรื่อง ความหมาย ความตั้งใจ), technical (นอยส์ รายละเอียด ข้อจำกัดอุปกรณ์)

- ประเภทภาพที่ผู้ใช้เลือก: ${genre && genre !== "auto" ? GENRES[genre] : "ไม่ได้ระบุ ให้คุณระบุเอง"}

กติกาสำคัญ:
1. ทุกคำชมและคำติต้องมี "หลักฐาน" ที่ชี้ไปยังสิ่งที่มองเห็นในภาพได้จริง (ตำแหน่ง วัตถุ สี แสง) ห้ามชมลอย ๆ
2. ห้ามเดาค่าเทคนิคของกล้อง ถ้า exif เป็น NO_EXIF หรือค่าเป็น null ให้บอกว่าตรวจสอบไม่ได้ ห้ามสร้างตัวเลขเอง
3. แยกข้อผิดพลาดทางเทคนิคออกจากความตั้งใจเชิงศิลปะ เช่น ภาพเบลอจากการเคลื่อนไหว ภาพมืด หรือสีจัด อาจเป็นความตั้งใจ ให้บอกเงื่อนไขว่าเมื่อไหร่ถือว่าตั้งใจ
4. เมื่อพูดถึงสาเหตุของภาพเบลอ ถ้าแยกไม่ได้ว่าเกิดจากกล้องสั่น ตัวแบบขยับ หรือโฟกัสผิด ให้ใส่ทุกความเป็นไปได้และระดับความมั่นใจ (สูง/ปานกลาง/ต่ำ)
5. คำแนะนำต้องเหมาะกับประเภทภาพ (ภาพคน สัตว์เลี้ยง วิว อาหาร สตรีท กลางคืน) และทำได้จริงด้วยโทรศัพท์
6. ใช้ภาษาไทยเป็นกันเองแบบบัดดี้ (ผู้หญิง ลงท้าย ค่ะ/นะคะ) เป็นธรรมชาติ ประโยคสั้น ถ้าต้องใช้ศัพท์เทคนิคให้อธิบายในวงเล็บ เช่น ISO (ความไวแสง)
7. ถ้าค่าที่วัดได้ขัดกับสิ่งที่คุณเห็น ให้เชื่อสิ่งที่เห็นในภาพ แต่บอกเหตุผลสั้น ๆ
8. คะแนนเป็นจำนวนเต็ม 1–5 (1 = ต้องแก้มาก, 3 = พอใช้, 5 = ดีมาก) ให้ใจกว้างกับภาพจากคนทั่วไปแต่ไม่ให้คะแนนเกินจริง · แอปแสดงค่านี้เป็น "ดาว" เพื่อช่วยฝึก ไม่ใช่คะแนนในชั้นเรียน ดังนั้นในข้อความทุกช่อง (รวม note) ห้ามเขียนตัวเลขคะแนน ห้ามใช้คำว่า "คะแนน" หรือ "เกรด" และห้ามพูดว่างานจะได้คะแนนเท่าไร
9. ถ้าในภาพมีบุคคล อย่าระบุตัวตน และอย่าวิจารณ์รูปร่างหน้าตาของบุคคล ให้พูดถึงการถ่ายภาพเท่านั้น
10. บอกตำแหน่งให้เจาะจง ทั้ง "ในภาพ" (เช่น มุมซ้ายบน ใบหน้า ดวงตา ฉากหลังด้านขวา) และ "ในสถานที่จริง" (เช่น ให้หน้าต่างอยู่ด้านซ้ายของตัวแบบ เปิดไฟเพดานเพิ่ม หันตัวแบบเข้าหาแสง ย่อตัวลงระดับสายตาสัตว์ ถอยหลังหนึ่งก้าว) ห้ามแนะนำกว้าง ๆ เช่น "เพิ่มแสง" โดยไม่บอกว่าเพิ่มจากทางไหนและทำอย่างไรด้วยของที่มีอยู่

กติกา: ตอบภาษาไทย สั้นแบบพิมพ์แชต แบ่งเป็น 1–3 ข้อความสั้น คั่นแต่ละข้อความด้วยบรรทัดว่าง แต่ละข้อความไม่เกิน 2 ประโยค ตอบตรงคำถามก่อน ไม่ร่ายยาว · ถ้าเรื่องต้องอธิบายหลายขั้น ให้บอกขั้นที่สำคัญที่สุดก่อน แล้วถามว่าอยากรู้ต่อไหม · คุยเฉพาะเรื่องการถ่ายภาพ/แต่งภาพ ถ้าถามเรื่องอื่นให้ชวนกลับมาเรื่องภาพอย่างสุภาพ · บอกตำแหน่งให้เจาะจงทั้งในภาพและในสถานที่จริง (แสงมาจากทางไหน ยืนตรงไหน แตะโฟกัสตรงไหน) · ห้ามเดาค่ากล้องที่ไม่มีข้อมูล · ห้ามชมหรือติโดยไม่มีหลักฐานในภาพ · ถ้ามีบุคคลในภาพ อย่าระบุตัวตนหรือวิจารณ์รูปร่างหน้าตา · ไม่ใช้อีโมจิ · ตอบเป็นข้อความธรรมดา ไม่ใช้ markdown หัวข้อ · ห้ามบอกว่างานจะได้คะแนนหรือเกรดเท่าไร ถ้าผู้ใช้ถามเรื่องคะแนน ให้บอกว่าดาวในแอปเป็นแค่ตัวช่วยฝึก เทียบกับคะแนนในชั้นเรียนไม่ได้ เพราะการให้คะแนนงานมีปัจจัยอื่น และอาจารย์อาจเห็นต่างได้
ข้อมูลภาพปัจจุบัน (ภาพแนบมาด้วยถ้ามี): ${JSON.stringify(ctx)}`;
    const msgs = [];

    msgs.push({ role: "user", content: msgs.length ? question : rules + "\n\nข้อความจากผู้ใช้: " + question });

  function normalizeBatch(j, n) {
    const arr = (x) => (Array.isArray(x) ? x : []);
    const photos = arr(j.photos).map((p) => ({ n: Math.round(Number(p.n)) || 0, genre: GENRES[p.genre] ? p.genre : "other", title: String(p.title || ""), score: clampScore(p.score), good: String(p.good || ""), fix: String(p.fix || ""), first_action: String(p.first_action || "") })).filter((p) => p.n >= 1 && p.n <= n);
    return { overall_message: String(j.overall_message || ""), strong_when: arr(j.strong_when).map(String).slice(0, 4),
      recurring_issues: arr(j.recurring_issues).slice(0, 4).map((x) => ({ issue: String(x.issue || ""), images: arr(x.images).map(Number).filter((k) => k >= 1 && k <= n), why: String(x.why || ""), fix: String(x.fix || "") })),
      practice_plan: arr(j.practice_plan).map(String).slice(0, 5), photos };
  }

  function parseJSON(text) {
    if (!text) throw new Error("empty");
    let t = String(text).trim().replace(/^```(?:json)?/i, "").replace(/```$/, "");
    const a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a < 0 || b < a) throw new Error("no JSON object");
    return JSON.parse(t.slice(a, b + 1));
  }
  function clampScore(x) { const n = Math.round(Number(x)); return n >= 1 && n <= 5 ? n : null; }
  function normalizeAnalysis(j) {
    const ss = j.shooting_setup && typeof j.shooting_setup === "object" ? j.shooting_setup : {};
    const out = { genre: GENRES[j.genre] ? j.genre : "other", summary: String(j.summary || ""), coach_message: String(j.coach_message || ""),
      shooting_setup: { light: String(ss.light || ""), position: String(ss.position || ""), focus: String(ss.focus || ""), camera: String(ss.camera || "") },
      scores: {}, strengths: [], improvements: [],
      intent_note: String(j.intent_note || ""), top_fixes: Array.isArray(j.top_fixes) ? j.top_fixes.filter((x) => x && (x.title || x.how)).slice(0, 3).map((x) => ({ dim: DIMS[x.dim] ? x.dim : "composition", title: String(x.title || ""), how: String(x.how || "") })) : [], reshoot_first: j.reshoot_first || null, reshoot_steps: Array.isArray(j.reshoot_steps) ? j.reshoot_steps.map(String).slice(0, 6) : [],
      edit_tips: Array.isArray(j.edit_tips) ? j.edit_tips.map(String).slice(0, 5) : [], principles: Array.isArray(j.principles) ? j.principles.filter((k) => PRINCIPLE_KEYS.includes(k)).slice(0, 5) : [], exif_note: String(j.exif_note || "") };
    for (const d of Object.keys(DIMS)) { const v = j.scores && j.scores[d]; out.scores[d] = v ? { score: clampScore(v.score ?? v), note: String(v.note || "") } : { score: null, note: "" }; }
    if (Array.isArray(j.strengths)) out.strengths = j.strengths.slice(0, 5).map((x) => ({ dim: DIMS[x.dim] ? x.dim : "composition", text: String(x.text || ""), evidence: String(x.evidence || "") }));
    if (Array.isArray(j.improvements)) out.improvements = j.improvements.slice(0, 4).map((x) => ({ dim: DIMS[x.dim] ? x.dim : "composition", issue: String(x.issue || ""), evidence: String(x.evidence || ""), cause: String(x.cause || ""), confidence: ["สูง", "ปานกลาง", "ต่ำ"].includes(x.confidence) ? x.confidence : "ปานกลาง", possible_causes: Array.isArray(x.possible_causes) ? x.possible_causes.map(String).slice(0, 4) : [], how_to_fix: String(x.how_to_fix || "") }));
    return out;
  }

  /* ---------- usage limiter (per browser) ---------- */
  const LIMITS = { perHour: 10, perDay: 30, minGapSec: 15 };
  const memLog = [];
  function readLog() { try { return JSON.parse(localStorage.getItem("pc_ai_log") || "[]"); } catch (e) { return memLog.slice(); } }
  function writeLog(a) { try { localStorage.setItem("pc_ai_log", JSON.stringify(a)); } catch (e) { memLog.length = 0; memLog.push(...a); } }
  function quota() {
    const now = Date.now();
    const log = readLog().filter((t) => now - t < 864e5);
    const hour = log.filter((t) => now - t < 36e5).length;
    const last = log.length ? Math.max(...log) : 0;
    const waitSec = Math.max(0, Math.ceil((last + LIMITS.minGapSec * 1000 - now) / 1000));
    let ok = true, reason = "";
    if (log.length >= LIMITS.perDay) { ok = false; reason = `ใช้ AI ครบ ${LIMITS.perDay} ครั้งของวันนี้แล้ว (ตั้งไว้เพื่อไม่ให้โควตาฟรีหมด) — ยังวิเคราะห์ด้วยเครื่องวัดในเครื่องได้ตามปกติ`; }
    else if (hour >= LIMITS.perHour) { ok = false; reason = `ใช้ AI ครบ ${LIMITS.perHour} ครั้งในชั่วโมงนี้แล้ว ลองใหม่ภายหลัง — ระหว่างนี้ยังวิเคราะห์ด้วยเครื่องวัดในเครื่องได้`; }
    else if (waitSec > 0) { ok = false; reason = `รออีก ${waitSec} วินาทีก่อนใช้ AI ครั้งถัดไป`; }
    // seconds until one more AI use becomes available (for the "rest" screen; does not change the limits)
    let freeInSec = waitSec;
    if (log.length >= LIMITS.perDay) freeInSec = Math.max(0, Math.ceil((Math.min(...log) + 864e5 - now) / 1000));
    else if (hour >= LIMITS.perHour) freeInSec = Math.max(0, Math.ceil((Math.min(...log.filter((t) => now - t < 36e5)) + 36e5 - now) / 1000));
    return { ok, reason, usedToday: log.length, usedHour: hour, limits: LIMITS, waitSec, freeInSec, kind: log.length >= LIMITS.perDay ? "day" : hour >= LIMITS.perHour ? "hour" : waitSec > 0 ? "gap" : "" };
  }
  function recordUse(weight = 1) { const log = readLog().filter((t) => Date.now() - t < 864e5); for (let i = 0; i < weight; i++) log.push(Date.now() + i); writeLog(log); }
  function clearUsage() { writeLog([]); try { localStorage.removeItem("pc_ai_log"); } catch (e) {} }

  /* ---------- AI adapters ---------- */
  const AI = { kind: "none", sample: null, imagesOK: false, gemini: null, puter: false, puterUser: "", puterModel: "" };
  try { AI.puterModel = localStorage.getItem("cb_puter_model") || ""; } catch (e) {}
  const hasPuter = () => typeof window !== "undefined" && window.puter && window.puter.auth && window.puter.ai;
  /* Puter (User-Pays): each user signs in with their own Puter account; AI cost comes from that account. */
  async function refreshPuter() {
    AI.puter = !!hasPuter();
    let signed = false;
    try { signed = AI.puter && window.puter.auth.isSignedIn(); } catch (e) { signed = false; }
    if (signed) {
      try { const u = await window.puter.auth.getUser(); AI.puterUser = (u && u.username) || ""; } catch (e) { AI.puterUser = ""; }
      if (AI.kind === "none" || AI.kind === "puter") AI.kind = "puter";
    } else if (AI.kind === "puter") { AI.kind = "none"; AI.puterUser = ""; }
    return signed;
  }
  async function signInPuter() { await window.puter.auth.signIn(); return refreshPuter(); } // must be called from a tap

  function bindOverlay(p) {
    const cv = $("#ov"); if (!cv) return;
    const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, m = p.metrics;
    const legends = { none: "", grid: "เส้นแบ่งสามส่วน · วงกลมประ = บริเวณที่เครื่องคาดว่าเป็นจุดสนใจ (ความมั่นใจต่ำ)", clip: "สีแดง = สว่างจนเป็นสีขาวล้วน · สีฟ้า = มืดจนเป็นสีดำล้วน", focus: "สีเขียวเข้ม = คมมาก · กรอบอำพัน = บริเวณที่คมที่สุด (เครื่องวัดไม่รู้ว่าส่วนไหนคือตัวแบบ)" };
    function draw(mode) {
      ctx.clearRect(0, 0, W, H);
      $("#ovLegend").textContent = legends[mode] + (mode === "focus" && m.noise.viewSigma > 2.5 ? " — ภาพนี้นอยส์มาก แผนที่อาจคลาดเคลื่อน" : "");
      if (mode === "grid") {
        ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = Math.max(1, W / 500);
        for (const fr of [1 / 3, 2 / 3]) { ctx.beginPath(); ctx.moveTo(W * fr, 0); ctx.lineTo(W * fr, H); ctx.moveTo(0, H * fr); ctx.lineTo(W, H * fr); ctx.stroke(); }
        const s = m.composition.subjectGuess; ctx.setLineDash([8, 6]); ctx.strokeStyle = "#FFC845"; ctx.lineWidth = Math.max(2, W / 300);
        ctx.beginPath(); ctx.arc(s.x * W, s.y * H, Math.min(W, H) * 0.12, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      } else if (mode === "clip") {
        const src = p.view.data, out = ctx.createImageData(W, H), o = out.data;
        for (let i = 0; i < src.length; i += 4) { const y = 0.2126 * src[i] + 0.7152 * src[i + 1] + 0.0722 * src[i + 2];
          if (y >= 250) { o[i] = 239; o[i + 1] = 68; o[i + 2] = 68; o[i + 3] = 210; } else if (y <= 5) { o[i] = 59; o[i + 1] = 130; o[i + 2] = 246; o[i + 3] = 210; } }
        ctx.putImageData(out, 0, 0);
      } else if (mode === "focus") {
        const [gx, gy] = m.sharp.sharpestTile.grid, map = m.sharp.focusMap, mx = Math.max(...map, 0.01);
        map.forEach((val, i) => { const tx = i % gx, ty = Math.floor(i / gx), a = Math.min(1, val / mx); ctx.fillStyle = `rgba(94,122,51,${(0.08 + a * 0.55).toFixed(2)})`; ctx.fillRect(tx * W / gx, ty * H / gy, W / gx, H / gy); });
        const st = m.sharp.sharpestTile; ctx.strokeStyle = "#FFC845"; ctx.lineWidth = Math.max(2, W / 250); ctx.strokeRect(st.tx * W / gx + 2, st.ty * H / gy + 2, W / gx - 4, H / gy - 4);
      }
    }
    $("#ovSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; $("#ovSeg").querySelectorAll("button").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b)); }); draw(b.dataset.o); if (b.dataset.o !== "none") $("#v-result .frame").scrollIntoView({ behavior: "smooth", block: "center" }); });
  }

    if (chatBusy) return; chatBusy = true;

      const r = await PCCoach.callAI(PCCoach.buildChatMessages({ photo: p, history: state.chat, question: q }), p ? [p.blob] : [], { onProgress: (txt) => { const t = $("#typing .bubble"); if (t && txt && txt !== "Thinking...") t.textContent = txt; } });

  /* ---------- WORKS (saved in this browser only) ---------- */
  function loadWorks() { try { return JSON.parse(localStorage.getItem("cb_works") || "[]"); } catch (e) { return []; } }
  function storeWorks(w) { try { localStorage.setItem("cb_works", JSON.stringify(w)); return true; } catch (e) { return false; } }
  async function saveWork(p) {
    const k = Math.min(1, 480 / Math.max(p.view.width, p.view.height));
    const c = canvasOf(Math.round(p.view.width * k), Math.round(p.view.height * k)); c.getContext("2d").putImageData(scaleImageData(p.view, c.width, c.height), 0, 0);
    const item = { id: "W" + Date.now().toString(36), date: new Date().toISOString(), thumb: c.toDataURL("image/jpeg", 0.72), reaction: p.reaction, genre: p.genre,
      goods: goods(p).slice(0, 4), fixes: fixes(p).slice(0, 3), first: firstAdvice(p), scores: Object.fromEntries(Object.entries(merged(p)).map(([d, s]) => [d, s.v])), ai: !!p.ai };
    const w = [item, ...loadWorks()].slice(0, 15);
    if (!storeWorks(w)) { toast("บันทึกในเบราว์เซอร์นี้ไม่ได้ (พื้นที่เต็มหรือถูกปิดไว้)", 4000); return; }
    toast("บันทึกไว้ในผลงานแล้ว (เก็บในเครื่องนี้เท่านั้น)");
  }
  function scaleImageData(img, w, h) { const s = canvasOf(img.width, img.height); s.getContext("2d").putImageData(img, 0, 0); const d = canvasOf(w, h), x = d.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(s, 0, 0, w, h); return x.getImageData(0, 0, w, h); }

    const rec = { id: (kind === "analyze" ? "T" : "P") + Date.now().toString(36), kind, date: new Date().toISOString(), app: APP_VERSION, localEngine: PCEngine.ENGINE_VERSION,
      file: { name: p.name, type: p.type, bytes: p.bytes, w: p.origW, h: p.origH, hasExif: !!p.exif }, genreUsed: p.genre, reaction: p.reaction || null,
      localScores: p.local.scores, localFindings: p.local.findings.map((f) => `${f.kind}:${f.title}`),
      ai: meta ? { engine: meta.engine, model: meta.model, promptVersion: meta.promptVersion, seconds: meta.seconds, error: meta.error || null, output: out } : null, reviewer: { verdict: "", note: "" } };
    state.logs.push(rec); p.logId = rec.id;
  }
  function addBatchLog(b) {
    const rec = { id: "B" + Date.now().toString(36), kind: "batch", date: new Date().toISOString(), app: APP_VERSION, localEngine: PCEngine.ENGINE_VERSION, files: b.items.map((p) => ({ name: p.name, w: p.origW, h: p.origH, hasExif: !!p.exif, localScores: p.local.scores })),
      ai: b.aiMeta ? { engine: b.aiMeta.engine, model: b.aiMeta.model, promptVersion: b.aiMeta.promptVersion, seconds: b.aiMeta.seconds, weight: b.aiMeta.weight, error: b.aiMeta.error || null, output: b.ai } : null, reviewer: { verdict: "", note: "" } };
    state.logs.push(rec); b.logId = rec.id;
  }
  function logPanel(id, meta, pv) {
    const rec = state.logs.find((r) => r.id === id); if (!rec) return "";
    return `<div class="sec-title">สำหรับผู้ทดสอบ</div><dl class="kv small"><dt>รหัส</dt><dd>${esc(rec.id)}</dd><dt>เวลา</dt><dd>${esc(new Date(rec.date).toLocaleString("th-TH"))}</dd><dt>AI</dt><dd>${esc(meta ? meta.engine : "ไม่ได้ใช้")}</dd><dt>โมเดล</dt><dd>${esc((meta && meta.model) || "-")}</dd><dt>Prompt</dt><dd>${esc(pv)}</dd></dl>
      <div class="chips" data-verdict="${esc(id)}" style="margin-top:10px">${["ถูกต้อง", "ถูกบางส่วน", "ไม่ถูกต้อง"].map((x) => `<button class="chip ${rec.reviewer.verdict === x ? "on" : ""}" data-v="${x}">${x}</button>`).join("")}</div>
      <textarea class="field" data-note="${esc(id)}" rows="2" style="margin-top:8px;padding:10px 14px;min-height:64px" placeholder="ข้อสังเกตของผู้ตรวจ">${esc(rec.reviewer.note)}</textarea>
      <button class="btn btn-outline btn-sm" data-copy style="margin-top:8px">${I("copy", 18)}คัดลอกบันทึกทั้งหมด</button>`;
  }
  function bindLog(id) {
    const rec = state.logs.find((r) => r.id === id); if (!rec) return;
    const c = document.querySelector(`[data-verdict="${id}"]`), n = document.querySelector(`[data-note="${id}"]`);
    if (c) c.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; rec.reviewer.verdict = b.dataset.v; c.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); });
    if (n) n.addEventListener("input", (e) => { rec.reviewer.note = e.target.value; });
    document.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => copyText(JSON.stringify(state.logs, null, 1))));
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); toast("คัดลอกแล้ว"); }
    catch (e) { openSheet(`<h2>คัดลอกข้อความ</h2><p class="small muted">กดค้างในกล่องแล้วเลือกคัดลอก</p><textarea class="field" rows="10" readonly style="padding:10px;min-height:200px">${esc(t)}</textarea><button class="btn btn-dark btn-block" data-close style="margin-top:10px">ปิด</button>`); }
  }

  /* ---------- QUOTA ("พักแป๊บ~") ---------- */
  function renderQuota() {
    const v = $("#v-quota"), q = PCCoach.quota(), next = state.quotaNext;
    const mins = Math.max(1, Math.ceil((q.freeInSec || 0) / 60));
    const when = mins >= 60 ? `${Math.floor(mins / 60)} ชม. ${mins % 60} นาที` : `${mins} นาที`;
    const full = q.kind === "hour" || q.kind === "day";
    v.innerHTML = `<div class="quota">${posePane("resting", 280, "l")}
      <h2>พักแป๊บ~<span>แล้วมาถ่ายต่อ!</span></h2>
      ${full ? `<p class="muted">${q.kind === "day" ? `วันนี้ใช้ AI ครบ ${q.limits.perDay} ครั้งแล้ว` : `ชั่วโมงนี้ใช้ AI ครบ ${q.limits.perHour} ครั้งแล้ว`}<br>ใช้ AI ได้อีกครั้งในอีกประมาณ</p><div class="big">${when}</div>`
        : `<p class="muted">ตอนนี้ใช้ AI ได้ตามปกติ</p>`}
      <div class="infobox">${I("camera", 30)}<span>ระหว่างนี้ยังใช้การวัดพื้นฐานได้<br><span class="muted small">แสง / ความคม / สี / EXIF</span></span></div>
      ${next ? `<a class="btn btn-amber btn-lg" href="#${next}" id="qNext">ดูผลการวัดพื้นฐาน</a>` : ""}
      <a class="btn ${next ? "btn-ghost" : "btn-amber btn-lg"}" href="#home">กลับหน้าแรก</a></div>`;
  }

  function emptyPage(title, h, sub, back) {
    return `${topbar(title, back || "home")}<div class="page no-tab"><div class="empty">${posePane("walking", 210, "r")}<h2>${esc(h)}</h2>${sub ? `<p class="muted">${esc(sub)}</p>` : ""}<a class="btn btn-amber" href="#home">${I("image", 22)}ไปเลือกรูป</a></div></div>`;
  }

  /* ---------- routing ---------- */
  const VIEWS = { home: renderHome, works: renderWorks, work: renderWork, tips: renderTips, profile: renderProfile, result: renderResult, batch: renderBatch, adjust: renderAdjust, compare: renderCompare, chat: renderChat, quota: renderQuota };
  const TABBED = ["home", "works", "tips", "profile"];
  function go(name) { if (location.hash !== "#" + name) location.hash = name; else show(name); }
  function show(name) {
    if (!VIEWS[name]) name = "home";
    Object.keys(VIEWS).forEach((x) => $("#v-" + x).classList.toggle("on", x === name));
    VIEWS[name]();
    $("#v-" + name).classList.add("on");
    $("#tabbar").classList.toggle("hide", !TABBED.includes(name));
    document.querySelectorAll("#tabbar a").forEach((a) => a.classList.toggle("on", a.dataset.v === name));
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));

  /* ---------- inputs ---------- */
  const pick = (list) => { const fs = Array.from(list || []); if (!fs.length) return; if (fs.length > MAX_BATCH) toast(`เลือกได้สูงสุด ${MAX_BATCH} รูป จะใช้ ${MAX_BATCH} รูปแรก`, 3500); fs.length === 1 ? runMain(fs[0]) : runBatch(fs); };
  const bindInput = (id, fn) => $(id).addEventListener("change", (e) => { const fl = Array.from(e.target.files); e.target.value = ""; if (fl.length) fn(fl); });
  bindInput("#inLibrary", pick);
  bindInput("#inAfterLib", (f) => runAfter(f[0]));
  bindInput("#inChat", (f) => runMain(f[0]));
  document.querySelectorAll("[data-ic]").forEach((el) => (el.innerHTML = I(el.dataset.ic, 24)));

  /* ---------- boot ---------- */
  show(location.hash.slice(1) || "home");
  maybeSplash();
  PCCoach.initAI().then(() => { const n = location.hash.slice(1) || "home"; renderHome(); if (["profile", "chat"].includes(n)) show(n); });
  window.PCApp = { state, runMain, runAfter, runBatch, prepare };
})();
</script>
</body>
</html>
