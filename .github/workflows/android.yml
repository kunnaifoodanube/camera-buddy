name: Build Android app bundle
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build unsigned release bundle
        working-directory: android
        run: gradle --no-daemon bundleRelease 2>&1 | tee build.log
      - name: Publish result to branch android-build
        if: always()
        run: |
          mkdir -p /tmp/out
          cp android/app/build/outputs/bundle/release/*.aab /tmp/out/ 2>/dev/null || true
          cp android/build.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b android-build
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-build
